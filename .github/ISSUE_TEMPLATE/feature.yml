name: "Feature request"
description: "Suggest an app feature; for MCP, Skill, or Toolkit submissions, use the matching form."
title: "[Feature]: "
labels: ["new feature", "considering"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and desired behavior. Maintainers decide acceptance,
        priority, and release scheduling after evaluation; a request is not a
        commitment to the current release.
  - type: textarea
    id: summary
    attributes:
      label: Problem and proposed behavior
      placeholder: What are you trying to do, what is missing, and what should happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: How would you know it works?
      placeholder: Give an example or observable acceptance criteria.
    validations:
      required: false
