name: "🧩 Submit an MCP server to the store"
description: Propose a new MCP server / toolkit for the PuPu store catalog.
title: "[MCP] <server name>"
labels: ["mcp-submission", "considering"]
body:
  - type: markdown
    attributes:
      value: |
        Propose an MCP server for PuPu. Maintainers will evaluate the submission;
        opening an issue does not commit it to a release. Accepted third-party
        entries can be installable as community integrations without a guarantee
        of the provider's paid service. See the guide:
        https://github.com/haoxiang-xu/PuPu/blob/main/docs/contributing/mcp-store-submission.md

        Prefer to submit a PR? Create your branch from upstream `dev` and select
        `haoxiang-xu/PuPu` with `base: dev` when opening it. GitHub may default to
        `main`; change the base to `dev` before submitting.
  - type: input
    id: name
    attributes:
      label: Server name
      placeholder: e.g. Acme Tasks
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      placeholder: What does it let the assistant do?
    validations:
      required: true
  - type: input
    id: source_repo
    attributes:
      label: Source repo or homepage URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the provider
      options:
        - I maintain this server
        - I contribute to this server
        - I am recommending someone else's server
    validations:
      required: true
  - type: textarea
    id: service_details
    attributes:
      label: Costs, data access, and known limitations
      description: State which tools cost money, where data goes, and what you have actually tested. Do not include credentials.
      placeholder: Free or paid; local or hosted; public client versus hosted backend; tested version and known failures.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio (runs locally via a command)
        - http (connects to a hosted server URL)
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install command (stdio) — MUST pin a version
      placeholder: npx -y @acme/mcp@1.2.3
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Server URL (http)
      placeholder: https://mcp.acme.com/sse
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - browser
        - dev
        - devops
        - productivity
        - workspace
        - memory
        - communication
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Does it need an API key or OAuth?
      options:
        - "No"
        - "Yes — API key / token"
        - "Yes — OAuth"
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Which tools does it expose, and which have side effects?
      placeholder: |
        - list_tasks (read-only)
        - create_task (writes — should require confirmation)
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT / Apache-2.0 / ...
    validations:
      required: true
  - type: checkboxes
    id: agreements
    attributes:
      label: Before submitting
      options:
        - label: For stdio, I provided an exact package version; for hosted HTTP, I provided the endpoint and its version policy if available.
          required: true
        - label: I have read the submission guide and the CLA (docs/CLA.md).
          required: true
