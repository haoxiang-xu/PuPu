name: Stage Verified Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Release QA run ID in release-candidate mode"
        required: true
        type: string
      release_tag:
        description: "Existing vX.Y.Z tag to stage"
        required: true
        type: string
      qualification_run_id:
        description: "Run ID holding the installed qualification receipt (omit only when the receipt is in the candidate Release QA run)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-promotion-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  stage-environment-preflight:
    name: Verify protected stage Environment
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node for release environment verifier
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout release environment verifier
        uses: actions/checkout@v4

      - name: Require protected release-stage Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release-stage" \
            | node scripts/release-qa/verify-github-environment.mjs --environment release-stage

  stage-draft:
    name: Stage exact candidate bytes in a Draft Release
    needs: stage-environment-preflight
    runs-on: ubuntu-latest
    environment: release-stage
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install release verifier dependencies
        run: npm ci

      - name: Resolve immutable release tag commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error title=Release tag missing::Could not resolve $RELEASE_TAG"
            exit 1
          fi
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Require dispatch from the exact release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ] || [ "$GITHUB_SHA" != "$TAG_COMMIT" ]; then
            echo "::error title=Tag dispatch required::Stage must execute the exact workflow revision at the immutable release tag"
            exit 1
          fi

      - name: Verify candidate Actions run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            | node scripts/release-qa/verify-actions-run-provenance.mjs \
              --run-id "$CANDIDATE_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$TAG_COMMIT" \
              --workflow-path .github/workflows/release-qa.yml

      - name: Verify qualification Actions run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id || inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          if [ "$QUALIFICATION_RUN_ID" = "$CANDIDATE_RUN_ID" ]; then
            QUALIFICATION_WORKFLOW_PATH=.github/workflows/release-qa.yml
          else
            QUALIFICATION_WORKFLOW_PATH=.github/workflows/release-qualification.yml
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            | node scripts/release-qa/verify-actions-run-provenance.mjs \
              --run-id "$QUALIFICATION_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$TAG_COMMIT" \
              --workflow-path "$QUALIFICATION_WORKFLOW_PATH"

      - name: Download exact retained candidate and qualification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id || inputs.candidate_run_id }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-qualification --dir qualification

      - name: Verify tag, qualification receipt, manifest, and candidate bytes
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id || inputs.candidate_run_id }}
        run: |
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest candidate/release-assets.v1.json \
            --asset-dir candidate/assets \
            --qa-report candidate/release-qa-report.json \
            --qualification qualification/release-qualification.v1.json \
            --require-qualification true \
            --require-restart-qualification true \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID"
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create or verify the Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.candidate.outputs.tag_commit }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error title=Release is already public::Stage only creates or updates Draft Releases"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$TAG_COMMIT" \
              --title "PuPu ${RELEASE_TAG#v}" \
              --notes "Deterministically staged from verified release candidate artifacts."
          fi

      - name: Upload only verified candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            candidate/assets/* \
            candidate/release-assets.v1.json \
            candidate/release-qa-report.json \
            candidate/windows-signing-evidence.v1.json \
            qualification/release-qualification.v1.json

      - name: Re-download and verify Draft Release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.candidate.outputs.tag_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id || inputs.candidate_run_id }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir draft-assets --clobber
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest draft-assets/release-assets.v1.json \
            --asset-dir draft-assets \
            --qa-report draft-assets/release-qa-report.json \
            --qualification draft-assets/release-qualification.v1.json \
            --require-qualification true \
            --require-restart-qualification true \
            --allow-extra release-assets.v1.json \
            --allow-extra release-qa-report.json \
            --allow-extra release-qualification.v1.json \
            --allow-extra windows-signing-evidence.v1.json \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID"
