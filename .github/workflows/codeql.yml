name: CodeQL

# Static analysis for the renderer/Electron JavaScript, the Python sidecar and
# the GitHub Actions workflows themselves. Results land in the repository's
# Security tab (Code scanning alerts) and as annotations on pull requests.
#
# This is an "advanced setup" workflow; the repository's default CodeQL setup
# must stay off, otherwise GitHub rejects the uploaded results.

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  schedule:
    # Weekly full scan so newly published queries are applied to unchanged code.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
