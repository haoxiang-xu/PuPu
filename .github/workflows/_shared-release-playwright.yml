name: Shared Release Playwright

on:
  workflow_call:
    inputs:
      qa_mode:
        description: "Closed QA mode: lite, release, or release-candidate."
        required: true
        type: string
      runner_selector:
        description: "Closed Playwright runner selector."
        required: true
        type: string
      source_ref:
        description: Exact caller Git ref.
        required: true
        type: string
      source_sha:
        description: Exact caller commit SHA.
        required: true
        type: string
      release_tag:
        description: Exact caller ref name.
        required: true
        type: string

jobs:
  playwright:
    name: Playwright Electron (${{ inputs.runner_selector }})
    runs-on: ${{ inputs.runner_selector == 'ubuntu-latest' && 'ubuntu-latest' || inputs.runner_selector == 'macos-latest' && 'macos-latest' || inputs.runner_selector == 'windows-latest' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      QA_MODE: ${{ inputs.qa_mode }}
      RUNNER_SELECTOR: ${{ inputs.runner_selector }}
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate closed shared Playwright inputs
        shell: bash
        run: |
          if [ "$SOURCE_REF" != "$GITHUB_REF" ] || [ "$SOURCE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Source identity mismatch::shared Playwright inputs must match the caller ref, SHA, and ref name"
            exit 1
          fi
          case "$QA_MODE:$RUNNER_SELECTOR" in
            lite:ubuntu-latest) ;;
            release:ubuntu-latest|release:macos-latest|release:windows-latest) ;;
            release-candidate:ubuntu-latest|release-candidate:macos-latest|release-candidate:windows-latest) ;;
            *) echo "::error title=Unsupported shared Playwright input tuple::$QA_MODE:$RUNNER_SELECTOR"; exit 1 ;;
          esac

      - name: Checkout PuPu
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Download the deterministic Unchain artifact
        uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: .release-qa/unchain-artifact

      - name: Verify and install the exact Unchain runtime
        id: artifact_verify
        shell: bash
        run: |
          WHEEL_PATH="$(find .release-qa/unchain-artifact -maxdepth 1 -type f -name '*.whl' -print -quit)"
          EVIDENCE_PATH=".release-qa/unchain-artifact/unchain-artifact.json"
          if [ -z "$WHEEL_PATH" ] || [ ! -f "$EVIDENCE_PATH" ]; then
            echo "::error title=Missing deterministic Unchain artifact::Playwright requires the wheel and evidence emitted by Deterministic QA"
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -r unchain_runtime/server/requirements.txt
          python -m pip install --force-reinstall --no-deps "$WHEEL_PATH"
          node scripts/release-qa/verify-unchain-artifact.mjs \
            --artifact "$WHEEL_PATH" \
            --evidence "$EVIDENCE_PATH" \
            --python python \
            --installed true
          printf 'python_command=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"

      - name: Install Electron runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      # Electron's SUID sandbox helper aborts on Linux runners unless it is
      # root-owned with mode 4755 (the spawn in e2e/fixtures/pupu_app.js runs
      # with sandboxing on).
      - name: Configure Electron SUID sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Verify session guard startup
        id: session_guard_smoke
        continue-on-error: true
        shell: bash
        env:
          UNCHAIN_PYTHON_BIN: ${{ steps.artifact_verify.outputs.python_command }}
          UNCHAIN_DATA_DIR: ${{ runner.temp }}/pupu-session-guard-smoke
          SESSION_GUARD_SMOKE_EVIDENCE_PATH: test-results/session-guard-smoke.json
        run: |
          "$UNCHAIN_PYTHON_BIN" scripts/release-qa/windows-session-guard-smoke.py

      - name: Run Playwright Electron release smoke
        id: playwright
        continue-on-error: true
        shell: bash
        env:
          UNCHAIN_PYTHON_BIN: ${{ steps.artifact_verify.outputs.python_command }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi

      - name: Verify nonzero Playwright execution evidence
        id: playwright_evidence
        if: always()
        continue-on-error: true
        run: node scripts/release-qa/verify-playwright-execution.mjs --results test-results/playwright/results.json

      - name: Write Playwright QA report
        if: always()
        env:
          QA_PLATFORM_NAME: playwright-${{ runner.os }}
          QA_PLATFORM_COMMAND: npm run test:e2e
          QA_UNCHAIN_ARTIFACT_EVIDENCE_PATH: ${{ steps.artifact_verify.outputs.evidence_path }}
          QA_REQUIRED_CHECKS_JSON: '["Unchain artifact continuity","Session guard startup smoke","Playwright Electron release smoke"]'
          QA_ARTIFACT_GLOBS_JSON: '["playwright-report/**/*","test-results/playwright/**/*","test-results/session-guard-smoke.json"]'
          QA_CHECKS_JSON: |
            [
              {"name":"Unchain artifact continuity","command":"node scripts/release-qa/verify-unchain-artifact.mjs --installed true","outcome":"${{ steps.artifact_verify.outcome }}","executed_tests":${{ steps.artifact_verify.outputs.executed_tests || 0 }}},
              {"name":"Session guard startup smoke","command":"python scripts/release-qa/windows-session-guard-smoke.py","outcome":"${{ steps.session_guard_smoke.outcome }}","executed_tests":${{ steps.session_guard_smoke.outcome == 'success' && 1 || 0 }}},
              {"name":"Playwright Electron release smoke","command":"npm run test:e2e","outcome":"${{ steps.playwright.outcome }}","executed_tests":${{ steps.playwright_evidence.outputs.executed_tests || 0 }}}
            ]
        run: node scripts/release-qa/write-job-report.mjs --out release-qa-job-report.json

      - name: Upload Playwright QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-job-report-playwright-${{ runner.os }}
          path: release-qa-job-report.json
          retention-days: 30

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/**/*
            test-results/playwright/**/*
