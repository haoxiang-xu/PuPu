          for f in paths:
              if not f.is_file(): raise RuntimeError('sealed_app_evidence_missing:'+f.as_posix())
              rows.append(scan_file(f))
          inventory=json.loads(pathlib.Path('reusable/linux-app-file-inventory.json').read_text())
          tar_path=pathlib.Path('reusable/linux-unpacked.tgz')
          seen=set(); dirs=set(); member_count=0; content_bytes=0
          with tarfile.open(tar_path,'r:gz') as archive:
              for member in archive:
                  name=member.name
                  clean_name=name.rstrip('/')
                  raw_parts=clean_name.split('/')
                  if '\\' in name or name.startswith('/') or any(part in ('..','.','') for part in raw_parts):
