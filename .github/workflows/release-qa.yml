name: 357 offline tool protocol (QA only)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        default: 18178a0611f50522f69fbd1d4841965bfbb0d016
        type: string
      evidence_replay_only:
        description: Recheck the preserved successful SDK exchange with the corrected qualifier only
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
cache-mode: read
jobs:
  qualification:
    if: ${{ !inputs.evidence_replay_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_MANIFEST: sha256:827adc5644e00dbb8e67fe5ecf6f7e88d9f542b1c4aff37744e0311c0acc2fe3
    steps:
      - name: Verify read-only cache authority
        run: |
          case "${ACTIONS_CACHE_MODE:-}" in
            read|none) echo "Cache authority: $ACTIONS_CACHE_MODE" ;;
            "") echo "Read authority enforced by workflow cache-mode" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
      - name: Bind source inputs and tools
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p test-results/execution
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa357/* > test-results/control-tools.sha256
          sha256sum candidate/package-lock.json > test-results/package-lock.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: 41262234256
          github-token: ${{ github.token }}
      - name: Install and verify the existing wheel
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "17b04aea25489e72eb4e6ab03a131f470bdcddf65f9e8a4eec757d9bfcbfe47c  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          python -m pip install --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL"
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" \
            --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert d['source']['revision'] == 'e0d2eb5e09976def467da7f32f2b0482b48c2ffd'
          assert d['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          assert d['build'] == {'built_once': True, 'wheel_count': 1}
          PY
          python -m pip freeze > test-results/pip-freeze.txt
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install fresh locked Node and Linux prerequisites
        run: |
          set -euo pipefail
          npm --prefix candidate ci
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools xvfb openssl
          candidate/node_modules/.bin/playwright install-deps chromium
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const binary = require('./candidate/node_modules/electron');
          assert.equal(binary, path.resolve('candidate/node_modules/electron/dist/electron'));
          assert(fs.lstatSync(binary).isFile());
          const helper = path.join(path.dirname(binary), 'chrome-sandbox');
          assert(fs.lstatSync(helper).isFile());
          fs.accessSync(helper, fs.constants.X_OK);
          fs.appendFileSync(process.env.GITHUB_ENV, `QA_ELECTRON=${binary}\n`);
          JS
          sudo chown root:root candidate/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 candidate/node_modules/electron/dist/chrome-sandbox
          set +e
          npm --prefix candidate ls --all --json > test-results/npm-ls.json 2> test-results/npm-ls.stderr
          inventory_exit=$?
          set -e
          printf '%s\n' "$inventory_exit" > test-results/npm-ls-exit.txt
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const tree = JSON.parse(fs.readFileSync('test-results/npm-ls.json'));
          const code = Number(fs.readFileSync('test-results/npm-ls-exit.txt', 'utf8'));
          if (code !== 0) {
            // Inventory is provenance, not a new clean-peer gate. Retain and
            // precisely register the existing locked diagnostic; no other
            // npm failure is accepted and no dependency is modified.
            assert.equal(code, 1);
            assert.deepEqual(tree.problems, ['invalid: yaml@1.10.3 ' + path.resolve('candidate/node_modules/yaml')]);
            assert.equal(require('./candidate/package-lock.json').packages['node_modules/yaml'].version, '1.10.3');
            console.log('Registered existing locked yaml inventory diagnostic; npm ci and lock integrity remain required.');
          }
          JS
          sha256sum -c test-results/package-lock.sha256
      - name: Pure fixture controls without any socket or App
        run: |
          python -I -B -c 'import sys,unittest;sys.path.insert(0,"control/tools/qa357");s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(n) for n in ["test_execution_fixture","test_tool_fixture","test_tool_isolated_import","test_tool_projection"]);r=unittest.TextTestRunner(verbosity=2).run(s);sys.exit(not r.wasSuccessful())'
          for file in control/tools/qa357/*.sh; do bash -n "$file"; done
          node --check control/tools/qa357/credential_probe.cjs
      - name: Qualify private real credential service and SDK over loopback TLS
        run: |
          set -euo pipefail
          export QA_OUT="$PWD/test-results/execution"
          export QA_CANDIDATE_ROOT="$PWD/candidate"
          bash control/tools/qa357/run_tool_qualification.sh
      - name: Verify original request and response bytes independently
        run: |
          python -I -B control/tools/qa357/verify_tool_protocol.py test-results/execution
      - name: Upload tool protocol evidence and exact tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 357-tool-protocol-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            test-results/**
            artifact/unchain-artifact.json
            control/tools/qa357/*
            control/docs/implementation/ticket-357-execution-qa.md
  replay:
    if: ${{ inputs.evidence_replay_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: 357-tool-protocol-evidence
          path: original-evidence
          run-id: 41389433333
          github-token: ${{ github.token }}
      - name: Bind unchanged real-SDK producer and credential inputs
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import json, hashlib
          original = Path('original-evidence')
          assert (original/'test-results/control-identity.txt').read_text().splitlines()[0] == '00490819a290c6591d9c1a0470ac62272a18b7de'
          assert (original/'test-results/candidate-identity.txt').read_text().splitlines()[0] == '18178a0611f50522f69fbd1d4841965bfbb0d016'
          names = ['credential_probe.cjs','execution_fixture.py','keyring_session.sh','sdk_probe.py',
                   'test_execution_fixture.py','run_execution_qualification.sh','run_tool_qualification.sh',
                   'test_tool_fixture.py','tool_fixture.py','tool_keyring_session.sh','tool_sdk_probe.py',
                   'test_tool_isolated_import.py']
          for name in names:
              assert (original/'control/tools/qa357'/name).read_bytes() == (Path('control/tools/qa357')/name).read_bytes(), name
          metadata = json.loads((original/'artifact/unchain-artifact.json').read_text())
          assert metadata['source']['revision'] == 'e0d2eb5e09976def467da7f32f2b0482b48c2ffd'
          assert metadata['runtime_manifest']['manifest_digest'] == 'sha256:827adc5644e00dbb8e67fe5ecf6f7e88d9f542b1c4aff37744e0311c0acc2fe3'
          Path('test-results').mkdir()
          files = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in original.rglob('*') if p.is_file()}
          Path('test-results/input-hashes.json').write_text(json.dumps(files, indent=2))
          PY
      - name: Pure controls and corrected qualifier against original bytes
        run: |
          python -I -B -c 'import sys,unittest;sys.path.insert(0,"control/tools/qa357");s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(n) for n in ["test_execution_fixture","test_tool_fixture","test_tool_isolated_import","test_tool_projection"]);r=unittest.TextTestRunner(verbosity=2).run(s);sys.exit(not r.wasSuccessful())'
          python -I -B - <<'PY'
          from pathlib import Path
          import importlib.util, json, hashlib
          spec = importlib.util.spec_from_file_location('independent_verifier', Path('control/tools/qa357/verify_tool_protocol.py'))
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          result = verifier.verify_tools('original-evidence/test-results/execution')
          Path('test-results/replayed-verification.json').write_text(json.dumps(result, indent=2))
          before = json.loads(Path('test-results/input-hashes.json').read_text())
          after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('original-evidence').rglob('*') if p.is_file()}
          assert before == after
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 357-tool-protocol-replay-evidence
          retention-days: 90
          path: |
            test-results/**
            original-evidence/**
            control/tools/qa357/**
            control/.github/workflows/release-qa.yml
