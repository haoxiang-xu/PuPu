          QA_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          QA_PYTHON: ${{ env.QA_PYTHON }}
          QA_SITE: ${{ env.QA_SITE }}
          QA_WHEEL: ${{ env.QA_WHEEL }}
          QA_WHEEL_SHA: ${{ env.QA_WHEEL_SHA }}
          QA_MANIFEST: ${{ env.QA_MANIFEST }}
        run: |
          set -euo pipefail
          export PUPU_BUNDLED_PYTHON="$(python control/tools/qa356/qualify_deferred_core.py before)"
          status=0
          bash control/tools/qa356/run_offline.sh bundled-core || status=$?
          python control/tools/qa356/qualify_deferred_core.py late
          test "$status" = 0

      - name: Run retained Linux App lifecycle against the real packaged pair
        shell: bash
        env:
