name: "#356 B1 native crash capture (QA only, non-delivery)"

# QA-only branch: replaces release-qa.yml so this one capture can be
# dispatched. Not for merge. Combination A only (Host 333643e8 + historical
# wheel 17b04aea, which reproduced exit 139 in run 41580610184), the system
# Python 3.12.15, the same third-party set as that run, one test case and the
# PR CI diagnostic setting faulthandler_timeout=60. The test runs under gdb in
# a loopback-only network namespace. At most three serial attempts; the first
# captured fatal signal stops the loop. No probe plugin, no product change.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crash:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST_A: 333643e82efc5a957ec358ca766b34c635ceaa68
      WHEEL_A_RUN: "41262234256"
      WHEEL_A_SHA: 17b04aea25489e72eb4e6ab03a131f470bdcddf65f9e8a4eec757d9bfcbfe47c
      CASE: "tests/test_skeleton_hook_approval_regressions.py::test_published_hook_projects_each_distinct_child_approval[1-2-1]"
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HOST_A }}
          path: hostA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: wheelA
          run-id: ${{ env.WHEEL_A_RUN }}
          github-token: ${{ github.token }}

      - name: Identities, CPU and the environment (before isolation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(git -C hostA rev-parse HEAD)" = "$HOST_A"
          echo "$WHEEL_A_SHA  wheelA/unchain-0.2.0-py3-none-any.whl" | sha256sum -c -
          python -m venv venvA
          venvA/bin/python -m pip install --disable-pip-version-check -q --retries 5 --timeout 60 -r control/tools/qa356_b1/third-party-freeze.txt
          venvA/bin/python -m pip install --disable-pip-version-check -q --no-deps wheelA/unchain-0.2.0-py3-none-any.whl
          venvA/bin/python -m pip freeze --all > out/freeze-A.txt
          venvA/bin/python -m pip check > out/pip-check-A.txt 2>&1
          diff <(grep -v -i '^unchain' out/freeze-A.txt) control/tools/qa356_b1/third-party-freeze.txt > out/third-party-diff.txt \
            && echo "third-party set identical to run 41580610184" >> out/third-party-diff.txt
          sha256sum hostA/unchain_runtime/server/tests/test_skeleton_hook_approval_regressions.py hostA/unchain_runtime/server/tests/conftest.py > out/test-files.sha256
          {
            echo "control=$(git -C control rev-parse HEAD)"; echo "host_a=$HOST_A"
            sha256sum wheelA/unchain-0.2.0-py3-none-any.whl
            echo "python=$(readlink -f venvA/bin/python)"; venvA/bin/python -c 'import sys; print(sys.version)'
            sha256sum "$(readlink -f venvA/bin/python)"
            venvA/bin/python -c 'import unchain, pytest; print("unchain", unchain.__file__); print("pytest", pytest.__version__)'
            uname -a; nproc
          } > out/identity.txt
          lscpu > out/lscpu.txt
          grep -m1 'model name' /proc/cpuinfo > out/cpu-model.txt
          grep -m1 '^flags' /proc/cpuinfo > out/cpu-flags.txt
          cat out/identity.txt out/cpu-model.txt out/third-party-diff.txt out/pip-check-A.txt

      - name: Prepare gdb and core dumps (before isolation)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gdb
          gdb --version | head -1 > out/gdb-version.txt
          mkdir -p "$RUNNER_TEMP/cores"
          chmod 777 "$RUNNER_TEMP/cores"
          # Kernel cores of a crash that happens after gdb lets it continue.
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p" > out/core-pattern.txt
          cat /proc/sys/kernel/core_pattern >> out/core-pattern.txt
          cat /proc/sys/kernel/yama/ptrace_scope > out/ptrace-scope.txt || true
          cat out/gdb-version.txt out/core-pattern.txt

      - name: Up to three attempts under gdb, loopback-only network
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export QA_UID="$(id -u)" QA_GID="$(id -g)" QA_WS="$GITHUB_WORKSPACE" QA_HOME="$HOME"
          for n in 1 2 3; do
            cat > "out/attempt-$n.gdb" <<GDB
          set pagination off
          set print thread-events off
          set width 0
          handle SIGPIPE nostop noprint pass
          handle SIGSEGV stop print pass
          handle SIGBUS stop print pass
          handle SIGABRT stop print pass
          handle SIGILL stop print pass
          handle SIGFPE stop print pass
          run
          echo \n=== QA356 AFTER RUN ===\n
          info program
          p \$_siginfo
          echo \n=== QA356 FAULTING THREAD ===\n
          thread
          bt
          info registers rip rsp
          x/6i \$pc-12
          echo \n=== QA356 ALL THREADS ===\n
          info threads
          thread apply all bt
          generate-core-file $GITHUB_WORKSPACE/out/attempt-$n.gdb.core
          echo \n=== QA356 CONTINUE TO TERMINATION (signals now passed without stopping) ===\n
          handle SIGSEGV nostop print pass
          handle SIGBUS nostop print pass
          handle SIGABRT nostop print pass
          handle SIGILL nostop print pass
          handle SIGFPE nostop print pass
          continue
          echo \n=== QA356 TERMINATION ===\n
          info program
          p \$_exitcode
          p \$_exitsignal
          GDB
            export QA_GDB="$GITHUB_WORKSPACE/out/attempt-$n.gdb" QA_N="$n"
            sudo --preserve-env=QA_UID,QA_GID,QA_WS,QA_HOME,QA_GDB,QA_N,CASE,PATH unshare --net /bin/bash -c '
              ip link set lo up
              ip -j route show > "$QA_WS/out/attempt-$QA_N-routes.json"
              ip -j address show > "$QA_WS/out/attempt-$QA_N-interfaces.json"
              cd "$QA_WS/hostA/unchain_runtime/server"
              exec setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups \
                env HOME="$QA_HOME" PATH="$PATH" LANG=C.UTF-8 QA_WS="$QA_WS" QA_GDB="$QA_GDB" CASE="$CASE" \
                bash -c '"'"'ulimit -c unlimited; exec gdb -batch -nx -x "$QA_GDB" --args "$QA_WS/venvA/bin/python" -m pytest "$CASE" -vv --tb=short -o faulthandler_timeout=60 -p no:cacheprovider'"'"'
            ' > "out/attempt-$n.gdb.log" 2>&1
            echo "attempt $n gdb_exit=$?" | tee -a out/attempts.txt
            if grep -q "received signal" "out/attempt-$n.gdb.log"; then
              echo "attempt $n captured: $(grep -m1 'received signal' "out/attempt-$n.gdb.log")" | tee -a out/attempts.txt
              break
            fi
            grep -E "exited normally|exited with code|passed in|failed in|Timeout" "out/attempt-$n.gdb.log" | tail -4 | tee -a out/attempts.txt
          done
          ls -la out > out/out-listing.txt 2>&1
          cat out/attempts.txt
          true

      - name: Compress cores
        if: always()
        shell: bash
        run: |
          for f in out/*.gdb.core "$RUNNER_TEMP"/cores/core.*; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> out/cores.sha256
            gzip -1 -c "$f" > "out/$(basename "$f").gz"
            rm -f "$f"
          done
          ls -la out

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa356-b1-native-crash
          if-no-files-found: error
          path: out/**
