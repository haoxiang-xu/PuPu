name: "#473 packaged-App offline acceptance (QA only, non-delivery)"

# QA-only branch: replaces release-qa.yml so the ordinary PR pipeline never runs here.
# Not for merge. Every identity is a dispatch input; nothing defaults to an old candidate.
# Identity = final delivery tree 001409d3; canonical wheel run42395251373.
# The qualified sidecar c91baa27 is reused after proving all 190 Host production modules unchanged.
# The final App is built and sealed once; CI wheels are a separate identity.
# Runtime starts only in the strict private namespace, with a qualified local TLS fixture.
on:
  workflow_dispatch:
    inputs:
      mode: { required: true, type: choice, default: "acceptance", options: ["acceptance", "package_only"], description: "Build and seal exactly the fixed candidate; runtime acceptance uses this retained App in a later serial job" }
      candidate_sha: { required: true, type: string, default: "5b94f79a867a37b40c79035cd6c58afef3aa68b4" }
      candidate_tree: { required: true, type: string, default: "001409d373925a68fe2add816361ec56b3690fff" }
      wheel_run_id: { required: true, type: string, default: "42395251373", description: "run holding the one Core wheel artifact (canonical)" }
      wheel_sha256: { required: true, type: string, default: "c1213803c1b3bb58f4fc78a03b1a00f80e001d63be00c4afae53ab4d972b12ec" }
      manifest_digest: { required: true, type: string, default: "sha256:c172bc02718aee771ddd4d247904f13cdaf003d3794148fd3ecd4d4e9a419e6b", description: "expected runtime protocol manifest" }
      feature_snapshot_json: { required: true, type: string, default: '{"enable_user_access_to_agents":true,"enable_user_access_to_characters":false,"enable_custom_model_providers":true,"enable_computer_use":false}', description: "QA build feature flags (release profile yields {} = Agents hidden); disclosed" }


permissions:
  contents: read
  actions: read

jobs:
  app:
    if: ${{ inputs.mode == 'acceptance' || inputs.mode == 'package_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_CANDIDATE: ${{ inputs.candidate_sha }}
      QA_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_MANIFEST: ${{ inputs.manifest_digest }}
    steps:
      - name: Validate immutable input identities
        run: |
          set -euo pipefail
          [[ "$QA_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_WHEEL_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$QA_MANIFEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.wheel_run_id }}" =~ ^[0-9]+$ ]]
          printf '%s' '${{ inputs.feature_snapshot_json }}' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("enable_user_access_to_agents") is True'
      - uses: actions/checkout@v4
        with: { path: control, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.candidate_sha }}", path: candidate, persist-credentials: false }
      - name: Bind the candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_CANDIDATE_TREE"
          mkdir -p ../test-results
          { echo "candidate=$QA_CANDIDATE"; echo "tree=$QA_CANDIDATE_TREE"; } > ../test-results/candidate-identity.txt
          git -C ../control rev-parse HEAD > ../test-results/control-identity.txt
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read the one Core wheel
        uses: actions/download-artifact@v4
        with: { name: "unchain-release-artifact", path: wheel, run-id: "${{ inputs.wheel_run_id }}", github-token: "${{ github.token }}" }
      - name: Verify and install the wheel (harness reader only), record the imported manifest
        working-directory: candidate
        run: |
          set -euo pipefail
          WHEEL="$(ls ../wheel/*.whl | head -1)"; test -n "$WHEEL"
          EVIDENCE="../wheel/unchain-artifact.json"; test -f "$EVIDENCE"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          python -I -c "import json,sys; e=json.load(open(sys.argv[1])); assert e['runtime_manifest']['manifest_digest']=='$QA_MANIFEST', e['runtime_manifest']['manifest_digest']" "$EVIDENCE"
          echo "QA_WHEEL_EVIDENCE=$(cd ../wheel && pwd)/unchain-artifact.json" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check -r unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps "$WHEEL"
          node scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$EVIDENCE" --installed true > ../test-results/wheel-verify.json
          python -I -c "import importlib,json; m=importlib.import_module('unchain.runtime.runtime_protocol').runtime_protocol_manifest(); json.dump(m, open('../test-results/imported-manifest.json','w'), indent=2); assert m['manifest_digest']=='$QA_MANIFEST', m['manifest_digest']"
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: Install the candidate's locked App dependencies and runtime resources
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          sha256sum package-lock.json > ../test-results/package-lock.sha256
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools tcpdump iptables
      - name: Read the already qualified immutable Host binary
        uses: actions/download-artifact@v4
        with: { name: 473-app-acceptance-evidence, path: retained-host, run-id: 42533943243, github-token: '${{ github.token }}' }
      - name: Verify unchanged Host source and reuse its exact binary
        working-directory: candidate
        run: |
          set -euo pipefail
          python ../control/qa-473/tools/reuse_host.py "$PWD" ../retained-host/unchain-server.built-once ../control/qa-473/tools/accepted-host-source.json ../test-results/retained-host-proof.json
          mkdir -p unchain_runtime/dist/linux
          cp ../retained-host/unchain-server.built-once unchain_runtime/dist/linux/unchain-server
          chmod +x unchain_runtime/dist/linux/unchain-server
          QA_BINARY_SHA=c91baa27f483ee861da1161b51cdd857282112589d31b6286342a2f86233f683
          echo "QA_BINARY_SHA=$QA_BINARY_SHA" >> "$GITHUB_ENV"
          { echo "sidecar_sha256=$QA_BINARY_SHA"; echo "reused_from_run=42533943243"; echo "wheel=$QA_WHEEL_SHA"; } > ../test-results/sidecar-identity.txt
      - name: Package the candidate around that sidecar, without publishing (cp10 recipe)
        working-directory: candidate
        run: |
          set -euo pipefail
          npm run mcp-runtime:prepare -- --target linux-x64
          export PUPU_BUILD_VERSION="$(node -p 'require("./package.json").version')"
          export PUPU_BUILD_FEATURE_SNAPSHOT_PATH="$RUNNER_TEMP/473-build-feature-flags.json"
          printf '%s\n' '${{ inputs.feature_snapshot_json }}' > "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH"
          cp "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH" ../test-results/build-feature-flags.input.json
          npm run build:web
          cp build/build_feature_flags.json ../test-results/build-feature-flags.packaged.json
          npm run notices
          echo "$QA_BINARY_SHA  unchain_runtime/dist/linux/unchain-server" | sha256sum -c -
          node node_modules/electron-builder/cli.js --linux dir --publish never
          PACKED="$PWD/dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server"
          echo "$QA_BINARY_SHA  $PACKED" | sha256sum -c -
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_CANDIDATE_TREE"
          git status --porcelain --untracked-files=no > ../test-results/tracked-after-app-build.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/linux-unpacked')
          rows={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('../test-results/app-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Seal the one packaged App
        run: |
          set -euo pipefail
          mkdir -p sealed
          cp test-results/app-files.json sealed/app-files.json
          tar -C candidate/dist -czf sealed/linux-unpacked.tgz linux-unpacked
          sha256sum sealed/linux-unpacked.tgz sealed/app-files.json > test-results/sealed-app.sha256
      - name: Preserve the sealed App before running it
        uses: actions/upload-artifact@v4
        with: { name: 473-sealed-app, if-no-files-found: error, compression-level: 0, path: sealed/* }
      - name: Keep the packaged App's original Chromium sandbox and bind the App path
        working-directory: candidate
        run: |
          set -euo pipefail
          SANDBOX="$PWD/dist/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$SANDBOX"; sudo chmod 4755 "$SANDBOX"
          stat -c '%U %a %n' "$SANDBOX" > ../test-results/chromium-sandbox.txt
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",p.build?.linux?.executableName||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "QA_APP=$EXE" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_ROOT=$PWD" >> "$GITHUB_ENV"
      - name: Strict isolated final App validation including real theme controls
        if: inputs.mode == 'acceptance'
        run: bash control/qa-473/tools/run_isolated.sh
      - name: Verify packaged App bytes after execution
        if: always()
        working-directory: candidate
        run: |
          python - <<'VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/linux-unpacked'); expected=json.loads(Path('../test-results/app-files.json').read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual==expected
          Path('../test-results/app-after.json').write_text(json.dumps({'matched':len(actual)}))
          VERIFY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 473-app-acceptance-evidence
          if-no-files-found: error
          path: |
            test-results/**
            !test-results/**/home/**
            !test-results/**/tmp/**
            !test-results/**/*.pcap
            !test-results/**/key.pem
