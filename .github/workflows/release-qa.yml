           PYTHONPATH="$QA_CONTROL:$QA_SERVER:$QA_SITE" UNCHAIN_SOURCE_PATH="$QA_SITE" \
           QA_OUT="$QA_OUT" QA_APP="$QA_APP" QA_CONTROL="$QA_CONTROL" QA_SITE="$QA_SITE" \
           QA_WHEEL="$QA_WHEEL" QA_WHEEL_SHA="$QA_WHEEL_SHA" QA_MANIFEST="$QA_MANIFEST" QA_BINARY_SHA="$QA_BINARY_SHA" \
           "$QA_PYTHON" -B "$QA_LAUNCHER" > "$QA_PRIVATE_LOG" 2>&1
          # No runtime launch, providers, capture or guard substitution: only the retained-state verifier.
          test "$(ip -j route show | tr -d '[:space:]')" = '[]'
          SH
          export QA_UID="$(id -u)" QA_GID="$(id -g)"
          export QA_HOME="$RUNNER_TEMP/356-verifier-home" QA_TMP="$RUNNER_TEMP/356-verifier-tmp"
          export QA_SERVER="$GITHUB_WORKSPACE/candidate/unchain_runtime/server" QA_CONTROL="$GITHUB_WORKSPACE/control/tools/qa356"
          export QA_LAUNCHER="$RUNNER_TEMP/356-verifier-main.py" QA_PRIVATE_LOG="$RUNNER_TEMP/356-verifier-private.log"
          mkdir "$QA_HOME" "$QA_TMP"
          ulimit -v 4194304
          # Exact predicate only: host namespace must actually contain non-loopback and refuse it.
          timeout 30s "$QA_PYTHON" -B "$RUNNER_TEMP/356-network-control.py" host-negative
          # Positive control gets its own clean namespace; it never imports Core or verifier code.
          export QA_LAUNCHER="$RUNNER_TEMP/356-network-control.py" QA_PRIVATE_LOG="$RUNNER_TEMP/356-network-control-private.log"
          timeout 30s sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_SERVER,QA_CONTROL,QA_SITE,QA_OUT,QA_APP,QA_WHEEL,QA_WHEEL_SHA,QA_MANIFEST,QA_BINARY_SHA,QA_PYTHON,QA_LAUNCHER,QA_PRIVATE_LOG             unshare --net /bin/bash "$RUNNER_TEMP/356-verifier-inside.sh"
          "$QA_PYTHON" - <<'PY'
          import json,os,pathlib,re
          record=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'356-network-control-private.log').read_text())
          assert set(record)=={'schema','control','outcome','count','only_lo','predicate_sha256'}
          assert record['schema']=='qa356.exact-network-measurement-control.v1' and record['control']=='ISOLATED_NAMESPACE_POSITIVE'
          assert record['outcome']=='EXACT_LOOPBACK_ACCEPTED' and type(record['count']) is int and record['count']==1 and record['only_lo'] is True
          assert re.fullmatch('[0-9a-f]{64}',record['predicate_sha256'])
          print(json.dumps(record,sort_keys=True))
