name: Branch exact-pair acceptance control (non-delivery)
on:
  ? workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  branch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92da429cc4b5cc3f0667f4336b4b0f88babe12d2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the candidate dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: .release-qa/unchain-artifact
          run-id: 41164456681
          github-token: ${{ github.token }}
      - name: Verify and install the already built candidate wheel
        shell: bash
        run: >
          set -euo pipefail

          test "$(git rev-parse HEAD)" = 92da429cc4b5cc3f0667f4336b4b0f88babe12d2

          WHEEL_PATH=.release-qa/unchain-artifact/unchain-0.2.0-py3-none-any.whl

          echo "43a8f11e62d6af71869b168055fdfcb91c34030257c2423fda24b99e6aa8155a  $WHEEL_PATH" | sha256sum -c -

          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r unchain_runtime/server/requirements.txt

          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 --constraint unchain_runtime/server/requirements.txt "$WHEEL_PATH" pytest==9.2.0

          python -m pip check

          node scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL_PATH" --evidence .release-qa/unchain-artifact/unchain-artifact.json --python python --installed true

          echo "QA_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"


          echo "QA_SITE=$(python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: Install Electron system dependencies
        run: node node_modules/@playwright/test/cli.js install-deps chromium
      - name: Resolve and configure the original Chromium sandbox
        shell: bash
        run: >
          set -euo pipefail

          node <<'NODE'

          const fs = require('node:fs');

          const path = require('node:path');

          const binary = require('electron');

          const dist = path.resolve('node_modules/electron/dist');

          if (binary !== path.join(dist, 'electron')) throw new Error('Unexpected Electron binary');

          for (const file of [binary, path.join(dist, 'chrome-sandbox')]) {
            if (!fs.lstatSync(file).isFile()) throw new Error('Nonregular Electron resource');
            fs.accessSync(file, fs.constants.X_OK);
          }

          NODE

          sudo chown root:root node_modules/electron/dist/chrome-sandbox

          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run only Branch desktop acceptance with no external route
        shell: bash
        run: >
          set -euo pipefail

          mkdir -p test-results

          export QA_UID="$(id -u)" QA_GID="$(id -g)"

          export QA_HOME="$RUNNER_TEMP/branch-app-home" QA_TMP="$RUNNER_TEMP/branch-app-tmp"

          mkdir -p "$QA_HOME" "$QA_TMP"

          sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_PYTHON unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -j route show | tr -d "[:space:]")" = "[]"
            ip -j address show > test-results/offline-interfaces.json
            exec setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i               PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8               CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=Linux               UNCHAIN_PYTHON_BIN="$QA_PYTHON" PYTHONDONTWRITEBYTECODE=1               NODE_OPTIONS=--max-old-space-size=2048               xvfb-run -a node node_modules/@playwright/test/cli.js test e2e/pupu-skeleton-branch.spec.js
          '
      - name: Run the two refused public rebase cases and four Branch executions offline
        shell: bash
        run: >
          set -euo pipefail

          export QA_UID="$(id -u)" QA_GID="$(id -g)"

          export QA_HOME="$RUNNER_TEMP/branch-public-home" QA_TMP="$RUNNER_TEMP/branch-public-tmp"

          export QA_SERVER="$PWD/unchain_runtime/server" QA_OUT="$PWD/test-results"

          mkdir -p "$QA_HOME" "$QA_TMP" "$QA_OUT"

          sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_PYTHON,QA_SITE,QA_SERVER,QA_OUT unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -j route show | tr -d "[:space:]")" = "[]"
            ip -j address show > "$QA_OUT/public-offline-interfaces.json"
            cd "$QA_SERVER"
            exec setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i               PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8               PYTHONPATH="$QA_SERVER:$QA_SITE" UNCHAIN_SOURCE_PATH="$QA_SITE" PYTHONDONTWRITEBYTECODE=1               "$QA_PYTHON" -B -m pytest -q -vv --tb=short -p no:cacheprovider               -o faulthandler_timeout=60 --junitxml="$QA_OUT/public-control.xml"               tests/test_skeleton_production_generation_edit.py::test_completed_public_skeleton_generation_can_be_edited_and_reused               tests/test_skeleton_production_readonly_admission.py::test_verified_terminal_launch_after_genuine_rebase_is_opt_in_and_read_only               tests/test_skeleton_branch_delivery.py
          '
      - name: Upload the independent App control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-exact-pair-acceptance-evidence
          if-no-files-found: error
          path: |
            test-results/**
            playwright-report/**
            .release-qa/unchain-artifact/unchain-artifact.json
cache-mode: read
