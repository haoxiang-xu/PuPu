name: 356 runtime exact-pair acceptance (QA only)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      wheel_run_id:
        description: Existing canonical wheel run; empty builds one wheel
        required: false
        type: string
      wheel_sha256:
        description: Required SHA when reusing a canonical wheel
        required: false
        type: string
      build_binary:
        description: Build and verify one sidecar after source acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_CANDIDATE: ${{ inputs.candidate_sha }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_MANIFEST: sha256:ba8943695d80993066a3ad1a25f62cb0086fa9f6ca2f66d676f559841f4e8e5d
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the immutable candidate and QA control
        env:
          CORE: ${{ inputs.core_sha }}
          WHEEL_RUN: ${{ inputs.wheel_run_id }}
        run: |
          set -euo pipefail
          [[ "$QA_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$WHEEL_RUN" ]]; then
            [[ "$QA_WHEEL_SHA" =~ ^[0-9a-f]{64}$ ]]
            [[ "$WHEEL_RUN" =~ ^[0-9]+$ ]]
          fi
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          mkdir -p test-results
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa356/* > test-results/control-tools.sha256
      - uses: actions/download-artifact@v4
        if: inputs.wheel_run_id != ''
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: ${{ inputs.core_sha }}
          path: runtime-source
          persist-credentials: false
      - name: Build one canonical wheel only when no existing artifact is supplied
        if: inputs.wheel_run_id == ''
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = "$CORE"
          python -m pip install --disable-pip-version-check 'setuptools>=69' wheel
          node candidate/scripts/release-qa/build-unchain-artifact.mjs --source "$PWD/runtime-source" --source-ref "$CORE" --out-dir "$PWD/artifact" --python python
          echo "QA_WHEEL_SHA=$(python -c "import json;print(json.load(open('artifact/unchain-artifact.json'))['artifact']['sha256'])")" >> "$GITHUB_ENV"
      - name: Retain the one canonical wheel even when later acceptance fails
        if: inputs.wheel_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: unchain-release-artifact
          if-no-files-found: error
          path: artifact/*
      - name: Install and verify the canonical wheel without rebuilding it
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL" pytest==9.2.0
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert evidence['source']['revision'] == os.environ['CORE']
          assert evidence['source']['dirty'] is False
          assert evidence['build'] == {'built_once': True, 'wheel_count': 1}
          assert evidence['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          PY
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
      - name: Core contract matrix against the installed canonical wheel offline
        run: bash control/tools/qa356/run_offline.sh core
      - name: Installed-wheel execution and retained-source boundaries offline
        run: bash control/tools/qa356/run_offline.sh source
      - name: Build one Linux sidecar from the same canonical wheel
        if: inputs.build_binary
        run: |
          set -euo pipefail
          export UNCHAIN_ARTIFACT_PATH="$QA_WHEEL" UNCHAIN_ARTIFACT_EVIDENCE_PATH="$PWD/artifact/unchain-artifact.json"
          export UNCHAIN_BUILD_VENV="$RUNNER_TEMP/356-build-venv" UNCHAIN_PYTHON_BIN="$QA_PYTHON"
          bash candidate/unchain_runtime/scripts/build_unchain_server.sh linux
          sha256sum candidate/unchain_runtime/dist/linux/unchain-server > test-results/sidecar.sha256
          echo "QA_BINARY_SHA=$(sha256sum candidate/unchain_runtime/dist/linux/unchain-server | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Binary HTTP profile/source/pin/import and cold-read cells offline
        if: inputs.build_binary
        run: bash control/tools/qa356/run_offline.sh binary
      - name: Install the candidate's locked App dependencies and runtime resources
        if: inputs.build_binary
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          sha256sum package-lock.json > ../test-results/package-lock.sha256
          npm ls --all --json > ../test-results/npm-dependencies.json || true
          npm run mcp-runtime:prepare -- --target linux-x64
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools
      - name: Package the actual candidate and the same sidecar without publishing
        if: inputs.build_binary
        working-directory: candidate
        run: |
          set -euo pipefail
          export PUPU_BUILD_VERSION="$(node -p 'require("./package.json").version')"
          export PUPU_BUILD_FEATURE_SNAPSHOT_PATH="$RUNNER_TEMP/356-build-feature-flags.json"
          printf '%s\n' '{"enable_user_access_to_agents":true,"enable_user_access_to_characters":false,"enable_custom_model_providers":true,"enable_computer_use":false}' > "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH"
          cp "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH" ../test-results/build-feature-flags.input.json
          npm run build:web
          cp build/build_feature_flags.json ../test-results/build-feature-flags.packaged.json
          npm run notices
          node node_modules/electron-builder/cli.js --linux dir --publish never
          PACKED="$PWD/dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server"
          echo "$QA_BINARY_SHA  $PACKED" | sha256sum -c -
          SANDBOX="$PWD/dist/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U %a %n' "$SANDBOX" > ../test-results/chromium-sandbox.txt
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",p.build?.linux?.executableName||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "QA_APP=$EXE" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_ROOT=$PWD" >> "$GITHUB_ENV"
          git status --porcelain --untracked-files=no > ../test-results/tracked-after-app-build.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/linux-unpacked')
          rows={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('../test-results/app-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Packaged App edit, execute, cold restart and second message offline
        if: inputs.build_binary
        run: bash control/tools/qa356/run_offline.sh app
      - name: Upload exact-pair evidence and reusable binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 356-runtime-pair-evidence
          if-no-files-found: error
          path: |
            test-results/**
            artifact/*
            control/tools/qa356/*
            candidate/build/static/js/*.map
            candidate/unchain_runtime/dist/linux/unchain-server
