                          raise RuntimeError('tar_file_inventory_hash_mismatch:'+rel)
                  elif member.issym():
                      target=member.linkname
                      if expected.get('type')!='symlink' or expected.get('target')!=target:
                          raise RuntimeError('tar_symlink_inventory_mismatch:'+rel)
