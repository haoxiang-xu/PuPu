name: Steps clock-qualified exact-pair acceptance control (non-delivery)
on:
  ? workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  steps-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5e248c470cb3e118aa86eab12edcec9015d7bac
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the candidate dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: .release-qa/unchain-artifact
          run-id: 41246710096
          github-token: ${{ github.token }}
      - name: Verify and install the already built candidate wheel
        shell: bash
        run: >
          set -euo pipefail

          test "$(git rev-parse HEAD)" = a5e248c470cb3e118aa86eab12edcec9015d7bac

          WHEEL_PATH=.release-qa/unchain-artifact/unchain-0.2.0-py3-none-any.whl

          echo "413da9fd23906337d5a22ba4f52e099aa543a2d745ce5fdaec4b023828cf3bc2  $WHEEL_PATH" | sha256sum -c -

          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r unchain_runtime/server/requirements.txt

          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 --constraint unchain_runtime/server/requirements.txt "$WHEEL_PATH" pytest==9.2.0

          python -m pip check

          node scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL_PATH" --evidence .release-qa/unchain-artifact/unchain-artifact.json --python python --installed true

          echo "QA_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"


          echo "QA_SITE=$(python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: Install Electron system dependencies
        run: node node_modules/@playwright/test/cli.js install-deps chromium
      - name: Resolve and configure the original Chromium sandbox
        shell: bash
        run: >
          set -euo pipefail

          node <<'NODE'

          const fs = require('node:fs');

          const path = require('node:path');

          const binary = require('electron');

          const dist = path.resolve('node_modules/electron/dist');

          if (binary !== path.join(dist, 'electron')) throw new Error('Unexpected Electron binary');

          for (const file of [binary, path.join(dist, 'chrome-sandbox')]) {
            if (!fs.lstatSync(file).isFile()) throw new Error('Nonregular Electron resource');
            fs.accessSync(file, fs.constants.X_OK);
          }

          NODE

          sudo chown root:root node_modules/electron/dist/chrome-sandbox

          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run only steps desktop acceptance with no external route
        shell: bash
        run: >
          set -euo pipefail

          mkdir -p test-results

          export QA_UID="$(id -u)" QA_GID="$(id -g)"

          export QA_HOME="$RUNNER_TEMP/steps-app-home" QA_TMP="$RUNNER_TEMP/steps-app-tmp"

          mkdir -p "$QA_HOME" "$QA_TMP"

          sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_PYTHON,QA_SITE unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -j route show | tr -d "[:space:]")" = "[]"
            ip -j address show > test-results/offline-interfaces.json
            exec setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i               PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8               CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=Linux               PUPU_STEPS_ACCEPTANCE=1 UNCHAIN_SOURCE_PATH="$QA_SITE" UNCHAIN_PYTHON_BIN="$QA_PYTHON" PYTHONDONTWRITEBYTECODE=1               NODE_OPTIONS=--max-old-space-size=2048               xvfb-run -a node node_modules/@playwright/test/cli.js test e2e/pupu-skeleton-steps.spec.js
          '
      - name: Write the imported-runtime probe
        shell: bash
        run: >-
          set -euo pipefail

          mkdir -p test-results

          cat > test-results/imported_runtime_probe.py <<'PY'

          import json, sys

          import unchain

          from unchain.runtime.runtime_protocol import runtime_protocol_manifest

          json.dump({"file": unchain.__file__, "manifest": runtime_protocol_manifest()["manifest_digest"], "executable": sys.executable}, sys.stdout)

          PY
      - name: Write the slow-start deadline qualifier
        shell: bash
        run: >
          set -euo pipefail

          mkdir -p test-results

          cat > test-results/slow_start_plugin.py <<'PY'

          import json, os, time

          from pathlib import Path

          from functools import wraps

          import pytest


          @pytest.fixture(autouse=True)

          def qa_slow_start(monkeypatch, request):
              if Path(request.module.__file__).name != "test_skeleton_tool_lifecycle.py":
                  return
              original = request.module._start
              @wraps(original)
              def delayed(*args, **kwargs):
                  wall = time.time_ns()
                  begin = time.monotonic_ns()
                  result = original(*args, **kwargs)
                  time.sleep(1.1)
                  elapsed = time.monotonic_ns() - begin
                  after = time.time_ns()
                  assert elapsed >= 1_100_000_000, "qualification delay was not applied"
                  assert after == wall, "test wall clock advanced during slow setup"
                  with (Path(os.environ["QA_OUT"])/"slow-start-observations.jsonl").open("a") as out:
                      out.write(json.dumps({"case": request.node.nodeid, "elapsed_ns": elapsed,
                                            "wall_before_ns": wall, "wall_after_ns": after,
                                            "required_delay_ns": 1_100_000_000})+"\n")
                  return result
              monkeypatch.setattr(request.module, "_start", delayed)
          PY
      - name: Run actual page steps, lifecycle, cold recovery and contracts offline
        shell: bash
        run: >
          set -euo pipefail

          export QA_UID="$(id -u)" QA_GID="$(id -g)"

          export QA_HOME="$RUNNER_TEMP/steps-public-home" QA_TMP="$RUNNER_TEMP/steps-public-tmp"

          export QA_SERVER="$PWD/unchain_runtime/server" QA_OUT="$PWD/test-results"

          mkdir -p "$QA_HOME" "$QA_TMP" "$QA_OUT"

          sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_PYTHON,QA_SITE,QA_SERVER,QA_OUT unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -j route show | tr -d "[:space:]")" = "[]"
            ip -j address show > "$QA_OUT/public-offline-interfaces.json"
            cd "$QA_SERVER"
            setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8 PYTHONPATH="$QA_SERVER:$QA_SITE" UNCHAIN_SOURCE_PATH="$QA_SITE" PYTHONDONTWRITEBYTECODE=1 "$QA_PYTHON" -B "$QA_OUT/imported_runtime_probe.py" > "$QA_OUT/imported-runtime.json"
            setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8 QA_OUT="$QA_OUT" PYTHONPATH="$QA_OUT:$QA_SERVER:$QA_SITE" UNCHAIN_SOURCE_PATH="$QA_SITE" PYTHONDONTWRITEBYTECODE=1 "$QA_PYTHON" -B -m pytest -q -vv --tb=short -p no:cacheprovider -p slow_start_plugin -o faulthandler_timeout=60 --junitxml="$QA_OUT/slow-start-control.xml" tests/test_skeleton_tool_lifecycle.py -k "test_expired_approval_is_refused_and_persistently_settles_without_effect or test_exact_deadline_still_accepts_and_resume_executes_only_if_approved or test_wrong_id_cannot_settle_an_expired_wait_and_reads_finish_it_once or test_terminal_expiry_retries_failed_semantic_write_then_allows_new_root or test_deadline_crossed_during_receipt_commit_aborts_and_settles"
                      exec setpriv --reuid="$QA_UID" --regid="$QA_GID" --init-groups env -i               PATH="$PATH" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8               PYTHONPATH="$QA_SERVER:$QA_SITE" UNCHAIN_SOURCE_PATH="$QA_SITE" PYTHONDONTWRITEBYTECODE=1               "$QA_PYTHON" -B -m pytest -q -vv --tb=short -p no:cacheprovider               -o faulthandler_timeout=60 --junitxml="$QA_OUT/public-control.xml"               tests/test_skeleton_steps_delivery.py tests/test_skeleton_tool_lifecycle.py tests/test_skeleton_tool_recovery.py tests/test_skeleton_tool_recovery_controls.py tests/test_skeleton_skill_preview.py tests/test_skeleton_production_interactions.py tests/test_skeleton_credential_boundary.py tests/test_skeleton_tool_schemas.py tests/test_skeleton_failure_message.py
          '
      - name: Compare the imported runtime with the verified artifact
        shell: bash
        run: >-
          set -euo pipefail

          node -e 'const fs=require("node:fs");const seen=JSON.parse(fs.readFileSync("test-results/imported-runtime.json","utf8"));const art=JSON.parse(fs.readFileSync(".release-qa/unchain-artifact/unchain-artifact.json","utf8"));const site=process.env.QA_SITE;if(!seen.file.startsWith(site+"/unchain/"))throw new Error("imported "+seen.file+" outside "+site);if(seen.manifest!==art.runtime_manifest.manifest_digest)throw new Error("manifest "+seen.manifest+" != "+art.runtime_manifest.manifest_digest);if(seen.executable!==process.env.QA_PYTHON)throw new Error("python "+seen.executable);console.log(JSON.stringify(seen));'
      - name: Upload the independent App control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steps-exact-pair-acceptance-evidence
          if-no-files-found: error
          path: |
            test-results/**
            playwright-report/**
            .release-qa/unchain-artifact/unchain-artifact.json
cache-mode: read
