          code=compile(ast.fix_missing_locations(ast.Module(body=guards,type_ignores=[])),'<exact-network-predicate>','exec')
          names={name for _,name in socket.if_nameindex()};assert 0<=len(names)<=4096
          if sys.argv[1:]==['host-negative']:
              assert any(name!='lo' for name in names), 'host_negative_requires_actual_nonloopback'
              try:exec(code,{'socket':socket})
              except AssertionError:outcome='INTENDED_ASSERTION_REFUSAL'
              else:raise AssertionError('host_nonloopback_was_accepted')
              control='HOST_NAMESPACE_NEGATIVE'
          else:
