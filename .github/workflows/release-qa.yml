              assert int(status['CapEff'].strip(),16)==0 and status['NoNewPrivs'].strip()=='1'
              exec(code,{'socket':socket})
              assert names=={'lo'}
              control='ISOLATED_NAMESPACE_POSITIVE';outcome='EXACT_LOOPBACK_ACCEPTED'
          print(json.dumps({'schema':'qa356.exact-network-measurement-control.v1','control':control,'outcome':outcome,'count':len(names),'only_lo':names=={'lo'},'predicate_sha256':predicate_sha},sort_keys=True))
          PY
