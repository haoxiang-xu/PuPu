                  if member.isfile():
                      if expected.get('type')!='file' or member.size!=expected.get('size'):
                          raise RuntimeError('tar_file_inventory_type_or_size_mismatch:'+rel)
                      source=archive.extractfile(member)
                      if source is None: raise RuntimeError('unreadable_tar_member:'+rel)
                      digest=hashlib.sha256(); size=0; carry=b''
                      while True:
                          chunk=source.read(1024*1024)
                          if not chunk: break
