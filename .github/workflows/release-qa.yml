          receipt={'schema':'qa356.retained-verifier-replay.v1','status':'ORIGINAL_RUNTIME_PLUS_VERIFIER_REPLAY_PASS','original_run':42320831594,'original_workflow_conclusion':'FAILURE','current_ci_run':42319490116,'current_ci_status':'completed_success','host_sha':before['host'],'wheel_sha256':before['wheel'],'manifest':before['manifest'],'sidecar_sha256':before['sidecar'],'tar_sha256':before['tar'],'sealed_inventory_sha256':before['inventory'],'wrapper_mode':'runpy_full_main_direct_script_argv_path','core_import_count':len(proof['core']),'host_import_count':len(proof['host']),'preserved_raw_state':True,'preserved_retained_inputs':True,'preserved_sealed_inventory':True,'original_auth_scan':'PASS_ORIGINAL_OBSERVATION_NOT_NEW_SCAN','derived_output_hashes':{name:digest(work/name) for name in sorted(derived)},'actual_imports_sha256':digest(out/'actual-imports.json'),'input_receipt_sha256':digest(out/'input-receipt.json'),'current_ci_before_sha256':digest(out/'current-ci-before.json')}
          raw=(json.dumps(receipt,sort_keys=True)+'\n').encode();assert len(raw)<=16384
          publish=R/'replay-publish';publish.mkdir();(publish/'replay-receipt.json').write_bytes(raw)
