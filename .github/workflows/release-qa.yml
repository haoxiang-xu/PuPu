name: 356 runtime exact-pair acceptance (QA only)
on:
  workflow_dispatch:
    inputs:
      qa_scope:
        description: Full Linux pair, unfinished Host/App cells, or serial native package smoke
        type: choice
        options: [pair, host-pair, platforms, windows-guard]
        default: pair
      candidate_sha:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      wheel_run_id:
        description: Existing canonical wheel run; empty builds one wheel
        required: false
        type: string
      wheel_sha256:
        description: Required SHA when reusing a canonical wheel
        required: false
        type: string
      build_binary:
        description: Build and verify one sidecar after source acceptance
        type: boolean
        default: false
cache-mode: read
permissions:
  contents: read
  actions: read
jobs:
  windows-guard:
    if: inputs.qa_scope == 'windows-guard'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose the exact native QA rule without starting product processes
        run: python -B tools/qa356/windows_guard_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 356-windows-guard-diagnostic
          path: test-results/windows-guard.json
          if-no-files-found: error
  pair:
    if: inputs.qa_scope == 'pair' || inputs.qa_scope == 'host-pair'
    runs-on: ubuntu-latest
    # The complete installed suites precede binary/App builds. Keep their
    # completed evidence independently; a package timeout must not erase it.
    timeout-minutes: 105
    env:
      QA_CANDIDATE: ${{ inputs.candidate_sha }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_MANIFEST: sha256:ba8943695d80993066a3ad1a25f62cb0086fa9f6ca2f66d676f559841f4e8e5d
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned bootstrap dependencies before reading the wheel manifest
        run: python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
      - name: Bind the immutable candidate and QA control
        env:
          CORE: ${{ inputs.core_sha }}
          WHEEL_RUN: ${{ inputs.wheel_run_id }}
        run: |
          set -euo pipefail
          [[ "$QA_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$WHEEL_RUN" ]]; then
            [[ "$QA_WHEEL_SHA" =~ ^[0-9a-f]{64}$ ]]
            [[ "$WHEEL_RUN" =~ ^[0-9]+$ ]]
          fi
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          mkdir -p test-results
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa356/* > test-results/control-tools.sha256
      - uses: actions/download-artifact@v4
        if: inputs.wheel_run_id != ''
        with:
          name: ${{ inputs.wheel_run_id == '41550715702' && '356-runtime-pair-evidence' || 'unchain-release-artifact' }}
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: ${{ inputs.core_sha }}
          path: runtime-source
          persist-credentials: false
      - name: Complete evidence for the retained failed-bootstrap wheel without rebuilding
        if: inputs.wheel_run_id == '41550715702'
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          test "$CORE" = 29e83c4b0df38089fd8c2e1b0e45dd92f2a6a1dd
          test "$QA_WHEEL_SHA" = 949a89475894b13ac324b90671c714ccd3125509cf6b313df739c66dc8292de6
          test "$(git -C runtime-source rev-parse HEAD)" = "$CORE"
          cp artifact/artifact/unchain-0.2.0-py3-none-any.whl artifact/unchain-0.2.0-py3-none-any.whl
          echo "$QA_WHEEL_SHA  artifact/unchain-0.2.0-py3-none-any.whl" | sha256sum -c -
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {buildUnchainArtifactEvidence, inspectRuntimeManifestFromWheel} from './candidate/scripts/release-qa/unchain-artifact.mjs';
          const artifactPath='artifact/unchain-0.2.0-py3-none-any.whl';
          const runtimeManifest=inspectRuntimeManifestFromWheel({artifactPath,python:'python'});
          const evidence=buildUnchainArtifactEvidence({artifactPath,runtimeManifest,source:{repository:'haoxiang-xu/unchain',ref:process.env.CORE,revision:process.env.CORE,dirty:false}});
          fs.writeFileSync('artifact/unchain-artifact.json',JSON.stringify(evidence,null,2)+'\n');
          fs.writeFileSync('test-results/wheel-bootstrap-recovery.json',JSON.stringify({original_run:41550715702,wheel_sha256:process.env.QA_WHEEL_SHA,rebuild:false,original_failure:'manifest import lacked bootstrap httpx; wheel was built and retained',cache_read_control_omission:'disclosed, not waived; restored for this run'},null,2)+'\n');
          JS
      - name: Build one canonical wheel only when no existing artifact is supplied
        if: inputs.wheel_run_id == ''
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = "$CORE"
          python -m pip install --disable-pip-version-check 'setuptools>=69' wheel
          node candidate/scripts/release-qa/build-unchain-artifact.mjs --source "$PWD/runtime-source" --source-ref "$CORE" --out-dir "$PWD/artifact" --python python
          echo "QA_WHEEL_SHA=$(python -c "import json;print(json.load(open('artifact/unchain-artifact.json'))['artifact']['sha256'])")" >> "$GITHUB_ENV"
      - name: Retain the one canonical wheel even when later acceptance fails
        if: inputs.wheel_run_id == '' || inputs.wheel_run_id == '41550715702'
        uses: actions/upload-artifact@v4
        with:
          name: unchain-release-artifact
          if-no-files-found: error
          path: |
            artifact/unchain-0.2.0-py3-none-any.whl
            artifact/unchain-artifact.json
      - name: Install and verify the canonical wheel without rebuilding it
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL" pytest==9.2.0
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert evidence['source']['revision'] == os.environ['CORE']
          assert evidence['source']['dirty'] is False
          assert evidence['build'] == {'built_once': True, 'wheel_count': 1}
          assert evidence['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          PY
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
      - name: Core contract matrix against the installed canonical wheel offline
        if: inputs.qa_scope == 'pair'
        run: bash control/tools/qa356/run_offline.sh core
      - name: Preserve the completed installed Core cell before later stages
        if: always() && inputs.qa_scope == 'pair'
        uses: actions/upload-artifact@v4
        with:
          name: 356-installed-core
          if-no-files-found: error
          path: |
            test-results/core/**
            test-results/*identity.txt
            artifact/unchain-artifact.json
            !test-results/**/pytest-data/**
      - name: Installed-wheel execution and retained-source boundaries offline
        run: bash control/tools/qa356/run_offline.sh source
      - name: Preserve installed Host evidence before binary/App builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 356-installed-host
          if-no-files-found: error
          path: |
            test-results/source/**
            test-results/*identity.txt
            artifact/unchain-artifact.json
            !test-results/**/pytest-data/**
      - name: Build one Linux sidecar from the same canonical wheel
        if: inputs.build_binary
        run: |
          set -euo pipefail
          export UNCHAIN_ARTIFACT_PATH="$QA_WHEEL" UNCHAIN_ARTIFACT_EVIDENCE_PATH="$PWD/artifact/unchain-artifact.json"
          export UNCHAIN_BUILD_VENV="$RUNNER_TEMP/356-build-venv" UNCHAIN_PYTHON_BIN="$QA_PYTHON"
          bash candidate/unchain_runtime/scripts/build_unchain_server.sh linux
          sha256sum candidate/unchain_runtime/dist/linux/unchain-server > test-results/sidecar.sha256
          echo "QA_BINARY_SHA=$(sha256sum candidate/unchain_runtime/dist/linux/unchain-server | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Binary HTTP profile/source/pin/import and cold-read cells offline
        if: inputs.build_binary
        run: bash control/tools/qa356/run_offline.sh binary
      - name: Read the frozen v1.4 producer binary without rebuilding it
        if: inputs.build_binary
        uses: actions/download-artifact@v4
        with:
          name: 357-pair-backend-evidence
          path: legacy-artifact
          run-id: 41263562114
          github-token: ${{ github.token }}
      - name: Bind historical producer and resume through the current binary offline
        if: inputs.build_binary
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os
          matches=list(Path('legacy-artifact').rglob('unchain-server'))
          assert len(matches)==1, matches
          binary=matches[0].resolve()
          assert sha256(binary.read_bytes()).hexdigest()=='e0162fc116e3f2970c67bc6c5458d1a305e6404dbb11b6e22db25897cad77ff6'
          binary.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as stream: stream.write('QA_OLD_BINARY='+str(binary)+'\n')
          PY
      - name: Real v1.4 launch cold-resumes A, while the next run uses saved B
        if: inputs.build_binary
        run: bash control/tools/qa356/run_offline.sh chat
      - name: Install the candidate's locked App dependencies and runtime resources
        if: inputs.build_binary
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          sha256sum package-lock.json > ../test-results/package-lock.sha256
          npm ls --all --json > ../test-results/npm-dependencies.json || true
          npm run mcp-runtime:prepare -- --target linux-x64
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools
      - name: Package the actual candidate and the same sidecar without publishing
        if: inputs.build_binary
        working-directory: candidate
        run: |
          set -euo pipefail
          export PUPU_BUILD_VERSION="$(node -p 'require("./package.json").version')"
          export PUPU_BUILD_FEATURE_SNAPSHOT_PATH="$RUNNER_TEMP/356-build-feature-flags.json"
          printf '%s\n' '{"enable_user_access_to_agents":true,"enable_user_access_to_characters":false,"enable_custom_model_providers":true,"enable_computer_use":false}' > "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH"
          cp "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH" ../test-results/build-feature-flags.input.json
          npm run build:web
          cp build/build_feature_flags.json ../test-results/build-feature-flags.packaged.json
          npm run notices
          node node_modules/electron-builder/cli.js --linux dir --publish never
          PACKED="$PWD/dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server"
          echo "$QA_BINARY_SHA  $PACKED" | sha256sum -c -
          SANDBOX="$PWD/dist/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U %a %n' "$SANDBOX" > ../test-results/chromium-sandbox.txt
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",p.build?.linux?.executableName||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "QA_APP=$EXE" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_ROOT=$PWD" >> "$GITHUB_ENV"
          git status --porcelain --untracked-files=no > ../test-results/tracked-after-app-build.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/linux-unpacked')
          rows={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('../test-results/app-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Packaged App edit, execute, cold restart and second message offline
        if: inputs.build_binary
        run: bash control/tools/qa356/run_offline.sh app
      - name: Upload exact-pair evidence and reusable binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 356-runtime-pair-evidence
          if-no-files-found: error
          path: |
            test-results/**
            artifact/*
            control/tools/qa356/*
            candidate/build/static/js/*.map
            candidate/unchain_runtime/dist/linux/unchain-server
            !test-results/**/pytest-data/**
  platforms:
    if: inputs.qa_scope == 'platforms'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
            arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            arch: x64
          - runner: windows-latest
            target: win32-x64
            arch: x64
    env:
      QA_CANDIDATE: ${{ inputs.candidate_sha }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_MANIFEST: sha256:ba8943695d80993066a3ad1a25f62cb0086fa9f6ca2f66d676f559841f4e8e5d
      QA_RUNTIME_TARGET: ${{ matrix.target }}
      QA_ARCH: ${{ matrix.arch }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - name: Install the exact retained wheel and candidate dependencies
        shell: bash
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,os
          wheel=Path('artifact/unchain-0.2.0-py3-none-any.whl')
          assert sha256(wheel.read_bytes()).hexdigest()==os.environ['QA_WHEEL_SHA'], 'canonical_wheel_bytes_mismatch'
          evidence=json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert evidence['artifact']['sha256']=='sha256:'+os.environ['QA_WHEEL_SHA'], 'canonical_wheel_evidence_digest_mismatch'
          assert evidence['source']['revision']==os.environ['CORE'], 'canonical_wheel_source_mismatch'
          assert evidence['runtime_manifest']['manifest_digest']==os.environ['QA_MANIFEST'], 'canonical_wheel_manifest_mismatch'
          PY
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt artifact/unchain-0.2.0-py3-none-any.whl
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact artifact/unchain-0.2.0-py3-none-any.whl --evidence artifact/unchain-artifact.json --installed true --python python
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL=$(python -c 'from pathlib import Path;print(Path("artifact/unchain-0.2.0-py3-none-any.whl").resolve())')" >> "$GITHUB_ENV"
      - name: Install the candidate's locked JavaScript dependencies
        working-directory: candidate
        run: npm ci
      - name: Build native sidecar and unsigned package around the same wheel
        run: node control/tools/qa356/platform_build.cjs
      - name: Qualify egress, profile API and the physically packaged worker
        run: python -B control/tools/qa356/platform_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 356-native-${{ matrix.target }}
          if-no-files-found: error
          path: |
            test-results/platform/**
            artifact/unchain-artifact.json
            control/tools/qa356/platform_*
