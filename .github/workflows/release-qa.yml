name: "#473 retained App strict offline acceptance (QA only)"
on:
  workflow_dispatch:
    inputs:
      mode: {required: true, type: choice, default: acceptance, options: [acceptance]}
permissions: {contents: read, actions: read}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QA_CANDIDATE: 55151d361e5fbb82789a0e9242e878adcd000266
      QA_CANDIDATE_TREE: 72033d62ffb547d15464dae800a0fc6fe96ede4d
      QA_MANIFEST: sha256:c172bc02718aee771ddd4d247904f13cdaf003d3794148fd3ecd4d4e9a419e6b
      QA_BINARY_SHA: c91baa27f483ee861da1161b51cdd857282112589d31b6286342a2f86233f683
    steps:
      - uses: actions/checkout@v4
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {path: candidate, ref: 55151d361e5fbb82789a0e9242e878adcd000266, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: 473-sealed-app, path: sealed, run-id: 42533943243, github-token: '${{ github.token }}'}
      - name: Bind and verify retained App before any execution
        run: |
          set -euo pipefail
          mkdir -p test-results
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$QA_CANDIDATE_TREE"
          echo 'f962fcd827f347adfcb2d6b95a5f8f1f5a98a1b97a7014bc64914ff3b4667372  sealed/linux-unpacked.tgz' | sha256sum -c -
          echo 'ad780a5b0e7aa0e7f9690376f71fd8ebff26151263881d03360d8f84b53a133a  sealed/app-files.json' | sha256sum -c -
          tar -C sealed -xzf sealed/linux-unpacked.tgz
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('sealed/linux-unpacked')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          expected=json.loads(Path('sealed/app-files.json').read_text())
          assert actual==expected
          Path('test-results/retained-app-check.json').write_text(json.dumps({'matched':len(actual),'entries':actual},indent=2))
          PY
          cp sealed/app-files.json test-results/app-files.json
          echo "$QA_BINARY_SHA  sealed/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server" | sha256sum -c -
          { echo "candidate=$QA_CANDIDATE"; echo "tree=$QA_CANDIDATE_TREE"; echo "sidecar=$QA_BINARY_SHA"; git -C control rev-parse HEAD; } > test-results/identity.txt
          sudo chown root:root sealed/linux-unpacked/chrome-sandbox
          sudo chmod 4755 sealed/linux-unpacked/chrome-sandbox
          stat -c '%U %a %n' sealed/linux-unpacked/chrome-sandbox > test-results/sandbox.txt
          EXE="$(cd candidate && node -e 'const p=require("./package.json");console.log(p.build?.linux?.executableName||p.name.toLowerCase())')"
          echo "QA_APP=$PWD/sealed/linux-unpacked/$EXE" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_ROOT=$PWD/candidate" >> "$GITHUB_ENV"
      - name: Install QA readers and locked driver dependencies (before isolation)
        working-directory: candidate
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: '1'}
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check -r unchain_runtime/server/requirements.txt
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools tcpdump iptables
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: Strict private namespace controls, real SDK qualification, and retained App acceptance
        run: bash control/qa-473/tools/run_isolated.sh
      - name: Verify retained App bytes after execution
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('sealed/linux-unpacked'); expected=json.loads(Path('sealed/app-files.json').read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual==expected
          Path('test-results/retained-app-after.json').write_text(json.dumps({'matched':len(actual)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 473-retained-runtime
          if-no-files-found: error
          path: |
            test-results/**
            !test-results/runtime/home/**
            !test-results/runtime/tmp/**
            !test-results/**/*.pcap
            !test-results/**/key.pem
