name: "#448 packaged-App offline acceptance (QA only, non-delivery)"

# QA-only harness. Never merge this workflow into the delivery repository.
# The candidate App is reused byte-for-byte from sealed run 42554801016.
# Network egress remains blocked; the App talks only to the owned loopback fixture.
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: acceptance
        options: [acceptance, verify_only]
        description: Run the offline packaged-App #448 acceptance against the sealed App.

permissions:
  contents: read
  actions: read

jobs:
  app-448:
    if: ${{ inputs.mode == 'acceptance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QA_CANDIDATE: d5d75094a5788a17b432d284dbffbb5b10ccab24
      QA_CANDIDATE_TREE: bbb26cc25b9f438df2a1b6ac3a9877736b26334c
      QA_APP_TAR_SHA: 995519ba1dceb2cf98704cb892f401021e2f3bcf08d4708a3898eb9ad5ed409e
      QA_WHEEL_SHA: c1213803c1b3bb58f4fc78a03b1a00f80e001d63be00c4afae53ab4d972b12ec
      QA_MANIFEST: sha256:c172bc02718aee771ddd4d247904f13cdaf003d3794148fd3ecd4d4e9a419e6b
      QA_BINARY_SHA: c91baa27f483ee861da1161b51cdd857282112589d31b6286342a2f86233f683
      QA_OUT: ${{ github.workspace }}/test-results/runtime
      QA_CONTROL: ${{ github.workspace }}/control/qa-448/tools
      QA_CANDIDATE_ROOT: ${{ github.workspace }}/candidate

    steps:
      - name: Checkout QA controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Checkout immutable qualified candidate
        uses: actions/checkout@v4
        with:
          ref: d5d75094a5788a17b432d284dbffbb5b10ccab24
          path: candidate
          persist-credentials: false

      - name: Verify candidate identity
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_CANDIDATE_TREE"
          mkdir -p ../test-results/runtime
          { echo "candidate=$QA_CANDIDATE"; echo "tree=$QA_CANDIDATE_TREE"; } > ../test-results/candidate-identity.txt
          git -C ../control rev-parse HEAD > ../test-results/control-identity.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify the canonical runtime wheel
        uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: wheel
          run-id: 42395251373
          github-token: ${{ github.token }}

      - name: Install the locked harness dependencies and canonical wheel
        working-directory: candidate
        run: |
          set -euo pipefail
          WHEEL="$(find ../wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          EVIDENCE=../wheel/unchain-artifact.json
          test -f "$EVIDENCE"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          python -I -c "import json,sys; e=json.load(open(sys.argv[1])); assert e['runtime_manifest']['manifest_digest']=='$QA_MANIFEST'" "$EVIDENCE"
          npm ci
          python -m pip install --disable-pip-version-check -r unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps "$WHEEL"
          python -m pip install --disable-pip-version-check pytest==8.4.2
          node scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$EVIDENCE" --installed true > ../test-results/wheel-verify.json
          python -I -c "import importlib,json; m=importlib.import_module('unchain.runtime.runtime_protocol').runtime_protocol_manifest(); json.dump(m,open('../test-results/imported-manifest.json','w'),indent=2); assert m['manifest_digest']=='$QA_MANIFEST',m['manifest_digest' ]"
          QA_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          QA_SITE="$(python -c 'import site; print(site.getsitepackages()[0])')"
          echo "QA_PYTHON=$QA_PYTHON" >> "$GITHUB_ENV"
          echo "QA_SITE=$QA_SITE" >> "$GITHUB_ENV"

      - name: Install browser runtime and isolation utilities
        working-directory: candidate
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools tcpdump iptables

      - name: Download the sealed App from the qualified run
        uses: actions/download-artifact@v4
        with:
          name: 473-sealed-app
          path: sealed-app
          run-id: 42554801016
          github-token: ${{ github.token }}

      - name: Verify sealed archive and exact App files
        working-directory: candidate
        run: |
          set -euo pipefail
          test -f ../sealed-app/linux-unpacked.tgz
          test -f ../sealed-app/app-files.json
          echo "$QA_APP_TAR_SHA  ../sealed-app/linux-unpacked.tgz" | sha256sum -c -
          mkdir -p dist
          tar -xzf ../sealed-app/linux-unpacked.tgz -C dist
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('dist/linux-unpacked')
          expected=json.loads(Path('../sealed-app/app-files.json').read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, {'expected_files':len(expected),'actual_files':len(actual),
                                      'missing':sorted(set(expected)-set(actual))[:20],
                                      'extra':sorted(set(actual)-set(expected))[:20],
                                      'changed':[k for k in expected.keys() & actual.keys() if expected[k]!=actual[k]][:20]}
          Path('../test-results/sealed-app-verification.json').write_text(json.dumps(
              {'archive_sha256':'995519ba1dceb2cf98704cb892f401021e2f3bcf08d4708a3898eb9ad5ed409e',
               'file_count':len(actual),'exact_file_set_and_hashes':True},indent=2)+'\n')
          PY
          PACKED="dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server"
          echo "$QA_BINARY_SHA  $PACKED" | sha256sum -c -

      - name: Restore Chromium sandbox and bind the sealed App
        working-directory: candidate
        run: |
          set -euo pipefail
          SANDBOX="$PWD/dist/linux-unpacked/chrome-sandbox"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U %a %n' "$SANDBOX" > ../test-results/chromium-sandbox.txt
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",p.build?.linux?.executableName||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "QA_APP=$EXE" >> "$GITHUB_ENV"

      - name: Run the sealed App in the unchanged private offline namespace
        run: bash control/qa-448/tools/run_isolated.sh

      - name: Validate captured #448 evidence
        if: success()
        run: |
          set -euo pipefail
          test -f control/qa-448/tools/verify_app_448.py
          python -I -B control/qa-448/tools/verify_app_448.py

      - name: Verify sealed App bytes after execution
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('dist/linux-unpacked')
          expected=json.loads(Path('../sealed-app/app-files.json').read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, {'expected_files':len(expected),'actual_files':len(actual),
                                      'missing':sorted(set(expected)-set(actual))[:20],
                                      'extra':sorted(set(actual)-set(expected))[:20],
                                      'changed':[k for k in expected.keys() & actual.keys() if expected[k]!=actual[k]][:20]}
          Path('../test-results/sealed-app-after.json').write_text(json.dumps(
              {'file_count':len(actual),'exact_file_set_and_hashes':True},indent=2)+'\n')
          PY

      - name: Upload redacted evidence and state reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-448-app-acceptance-evidence
          if-no-files-found: warn
          path: |
            test-results/**
            !test-results/runtime/home/**
            !test-results/runtime/tmp/**
            !test-results/runtime/**/*.pcap
            !test-results/runtime/**/key.pem
            !test-results/runtime/state/**

  verify-448-retained:
    if: ${{ inputs.mode == 'verify_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_CANDIDATE_TREE: bbb26cc25b9f438df2a1b6ac3a9877736b26334c
      QA_MANIFEST: sha256:c172bc02718aee771ddd4d247904f13cdaf003d3794148fd3ecd4d4e9a419e6b
      QA_OUT: ${{ github.workspace }}/verification/runtime
    steps:
      - uses: actions/checkout@v4
        with: { path: control, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: ticket-448-app-acceptance-evidence
          path: raw-evidence
          run-id: 42565248774
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: wheel
          run-id: 42395251373
          github-token: ${{ github.token }}
      - name: Bind original evidence and canonical reader
        run: |
          set -euo pipefail
          mkdir -p proof
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          root=Path('raw-evidence')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('proof/raw-files-before.json').write_text(json.dumps(files,sort_keys=True,indent=2)+'\n')
          PYCODE
          cp -a raw-evidence verification
          WHEEL="$(find wheel -maxdepth 1 -name '*.whl' -print -quit)"
          echo "c1213803c1b3bb58f4fc78a03b1a00f80e001d63be00c4afae53ab4d972b12ec  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check -r control/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps "$WHEEL"
          echo "QA_WHEEL_PATH=$PWD/$WHEEL" >> "$GITHUB_ENV"
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Replay only the corrected raw verifier without network
        run: |
          set -euo pipefail
          sudo unshare --net --fork /usr/bin/env -i PATH="$PATH" \
            QA_OUT="$QA_OUT" QA_CANDIDATE_TREE="$QA_CANDIDATE_TREE" \
            QA_MANIFEST="$QA_MANIFEST" QA_WHEEL_PATH="$QA_WHEEL_PATH" \
            "$QA_PYTHON" -I -B "$PWD/control/qa-448/tools/verify_app_448.py" | tee proof/verifier.log
      - name: Confirm original input unchanged and retain exact verifier bytes
        if: always()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          root=Path('raw-evidence')
          before=json.loads(Path('proof/raw-files-before.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert before==after
          Path('proof/raw-after.json').write_text(json.dumps({'unchanged':len(after),'source_run':42565248774},indent=2)+'\n')
          PYCODE
          cp control/qa-448/tools/verify_app_448.py proof/verifier-as-run.py
          test ! -f verification/runtime/raw-verification.json || cp verification/runtime/raw-verification.json proof/raw-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket-448-retained-verification
          if-no-files-found: warn
          path: proof/**
