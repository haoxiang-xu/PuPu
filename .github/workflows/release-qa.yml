          PY
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Record pair qualification result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.auth_scan.outputs.pass }}" == true && "${{ job.status }}" == success ]] && python control/tools/qa356/qualify_deferred_core.py final; then
            printf '{"status":"PASS","candidate":"%s","core":"33e9552f35e537a03b9cd73cb154d642481162a8"}\n' "$QA_HOST_SHA" > test-results/status/qualification.txt
          else
            printf '{"status":"FAIL_OR_NOT_RUN","job_status":"%s"}\n' "${{ job.status }}" > test-results/status/qualification.txt
            exit 1
          fi

      - name: Upload complete evidence only after auth scan passes
        if: always() && steps.auth_scan.outputs.pass == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-linux-pair-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: |
            test-results/**
            reusable/**
            !**/home/**
            !**/journal-verification-copy/**
      - name: Upload safe status only when complete evidence is blocked
        if: always() && steps.auth_scan.outputs.pass != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-linux-pair-safe-status-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: test-results/status/**

  windows-native:
    if: inputs.scope == 'windows-native'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QA_EXPECTED_HOST_SHA: fa162b3d94791fad36da85f4a00ff36ecf758853
      QA_EXPECTED_HOST_TREE: 9ac15003c6fdabb2928be0e3f5d61ff6d47e386d
      QA_CORE_SHA: 33e9552f35e537a03b9cd73cb154d642481162a8
      QA_CORE_TREE: c7b327e243fd8152f869d1349776b066082d5fd9
      QA_HOST_SHA: ${{ inputs.candidate_sha }}
      QA_HOST_TREE: ${{ inputs.candidate_tree }}
      QA_WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
    steps:
      - name: Fail closed until final Host and wheel are frozen
        shell: pwsh
        run: |
          if ($env:QA_EXPECTED_HOST_SHA -notmatch '^[0-9a-f]{40}$' -or $env:QA_HOST_SHA -ne $env:QA_EXPECTED_HOST_SHA) { throw 'root must freeze exact Host SHA before dispatch' }
          if ($env:QA_EXPECTED_HOST_TREE -notmatch '^[0-9a-f]{40}$' -or $env:QA_HOST_TREE -ne $env:QA_EXPECTED_HOST_TREE) { throw 'root must freeze exact Host tree before dispatch' }
          if ($env:QA_WHEEL_RUN_ID -notmatch '^[0-9]+$' -or $env:QA_WHEEL_SHA -notmatch '^[0-9a-f]{64}$') { throw 'required CI wheel identity is incomplete' }
          if ($env:QA_CORE_SHA -ne '33e9552f35e537a03b9cd73cb154d642481162a8' -or $env:QA_CORE_TREE -ne 'c7b327e243fd8152f869d1349776b066082d5fd9') { throw 'Core identity mismatch' }
          New-Item -ItemType Directory -Force test-results/windows-wfp,test-results/platform,artifact | Out-Null
      - name: Check out QA controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Check out exact Host and Core
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/PuPu
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact Core source
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: 33e9552f35e537a03b9cd73cb154d642481162a8
          path: core
          persist-credentials: false
      - name: Download the one final required-CI wheel
        uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Node and Python
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Record system Python paths
        shell: pwsh
        run: |
          $pythonPath=(Get-Command python).Source
          $sitePath=python -c 'import sysconfig;print(sysconfig.get_path("purelib"))'
          if ($LASTEXITCODE -ne 0 -or -not $sitePath) { throw 'system Python site path query failed' }
          "QA_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          "QA_SITE=$($sitePath.Trim())" >> $env:GITHUB_ENV
      - name: Bind exact source and wheel evidence
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hostSha = git -C candidate rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Host git SHA query failed' }
          $hostTree = git -C candidate rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Host git tree query failed' }
          $coreSha = git -C core rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Core git SHA query failed' }
          $coreTree = git -C core rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Core git tree query failed' }
          if ($hostSha.Trim() -ne $env:QA_HOST_SHA -or $hostTree.Trim() -ne $env:QA_HOST_TREE) { throw 'Host identity mismatch' }
          if ($coreSha.Trim() -ne $env:QA_CORE_SHA -or $coreTree.Trim() -ne $env:QA_CORE_TREE) { throw 'Core identity mismatch' }
          $hostStatus = git -C candidate status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $hostStatus) { throw 'Host source checkout is dirty' }
          $coreStatus = git -C core status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $coreStatus) { throw 'Core source checkout is dirty' }
          $runJson = gh run view $env:QA_WHEEL_RUN_ID --repo haoxiang-xu/PuPu --json conclusion,headSha
          if ($LASTEXITCODE -ne 0) { throw 'required-CI run lookup failed' }
          $requiredRun = $runJson | ConvertFrom-Json
          if ($requiredRun.conclusion -ne 'success' -or $requiredRun.headSha -ne $env:QA_HOST_SHA) { throw 'required-CI run is not successful for exact Host SHA' }
          $wheels = @(Get-ChildItem artifact -Filter '*.whl' -File -Recurse)
          if ($wheels.Count -ne 1) { throw "expected exactly one wheel, found $($wheels.Count)" }
          $evidence = Get-Content artifact/unchain-artifact.json -Raw | ConvertFrom-Json
          if ($evidence.build.built_once -ne $true -or $evidence.build.wheel_count -ne 1 -or $evidence.source.revision -ne $env:QA_CORE_SHA -or $evidence.source.dirty -ne $false -or $evidence.runtime_manifest.manifest_digest -ne 'sha256:88d5f8d733e7f3dc94fb1cd20060fcc5f2611c0f94420e327bcb12664368bf2e') { throw 'artifact evidence mismatch' }
          if ((Get-FileHash $wheels[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $env:QA_WHEEL_SHA) { throw 'wheel SHA mismatch' }
          @'
          import pathlib,sys,zipfile
          wheel=pathlib.Path(sys.argv[1]); core=pathlib.Path('core/src/unchain')
          expected={p.relative_to(pathlib.Path('core/src')).as_posix():p.read_bytes() for p in core.rglob('*.py')}
          with zipfile.ZipFile(wheel) as archive:
              actual={name:archive.read(name) for name in archive.namelist() if name.startswith('unchain/') and name.endswith('.py')}
          assert actual.keys()==expected.keys(), {'wheel_only':sorted(actual.keys()-expected.keys()),'source_only':sorted(expected.keys()-actual.keys())}
          assert all(actual[name]==data for name,data in expected.items()), 'wheel_core_source_bytes_mismatch'
          '@ | python - $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'wheel/Core byte comparison failed' }
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact $wheels[0].FullName --evidence artifact/unchain-artifact.json --bytes-only true
          if ($LASTEXITCODE -ne 0) { throw 'artifact byte verification failed' }
          $canonicalWheel='artifact/unchain-0.2.0-py3-none-any.whl'
          $sourceWheel=[IO.Path]::GetFullPath($wheels[0].FullName)
          $targetWheel=[IO.Path]::GetFullPath($canonicalWheel)
          if (-not $sourceWheel.Equals($targetWheel,[StringComparison]::OrdinalIgnoreCase)) { Copy-Item $sourceWheel $targetWheel -Force }
          "QA_WHEEL=$((Resolve-Path $canonicalWheel).Path)" >> $env:GITHUB_ENV
          "QA_MANIFEST=$($evidence.runtime_manifest.manifest_digest)" >> $env:GITHUB_ENV
      - name: Install exact wheel requirements
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'requirements installation failed' }
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt $env:QA_WHEEL
          if ($LASTEXITCODE -ne 0) { throw 'wheel installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip consistency check failed' }
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact $env:QA_WHEEL --evidence artifact/unchain-artifact.json --bytes-only true
          if ($LASTEXITCODE -ne 0) { throw 'artifact byte verification failed' }
      - name: Compile the reviewed WFP guard before native packaging
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and hash WFP guard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/windows-wfp | Out-Null
          $source='control/tools/qa356/windows_wfp_guard.c'
          $guard='test-results/windows-wfp/qa356-wfp-guard.exe'
          $sourceHash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLower()
          cl /nologo /W4 /WX /std:c17 /DUNICODE /D_UNICODE $source /link fwpuclnt.lib rpcrt4.lib ws2_32.lib "/OUT:$guard"
          if ($LASTEXITCODE -ne 0) { throw 'WFP C compile failed' }
          @{source_sha256=$sourceHash;exe_sha256=(Get-FileHash $guard -Algorithm SHA256).Hash.ToLower();compiler=(Get-Command cl).Source;msvc_version=$env:VCToolsVersion} | ConvertTo-Json | Set-Content test-results/windows-wfp/guard-build.json
      - name: Install candidate UI dependencies
        working-directory: candidate
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'locked UI dependency installation failed' }
      - name: Build the unsigned Windows directory package from the downloaded wheel once
        working-directory: .
        shell: pwsh
        env:
          QA_RUNTIME_TARGET: win32-x64
          QA_ARCH: x64
          QA_CANDIDATE: ${{ inputs.candidate_sha }}
          QA_PYTHON: ${{ env.QA_PYTHON }}
          UNCHAIN_ARTIFACT_PATH: ${{ github.workspace }}\artifact\unchain-0.2.0-py3-none-any.whl
          UNCHAIN_ARTIFACT_EVIDENCE_PATH: ${{ github.workspace }}\artifact\unchain-artifact.json
          QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
        run: |
          node control/tools/qa356/platform_build.cjs
          if ($LASTEXITCODE -ne 0) { throw 'native package build failed' }
      - name: Save exact package and find its three WFP images
        shell: pwsh
        run: |
          $pkg=Get-Content test-results/platform/package.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $pkg.binary -Algorithm SHA256).Hash.ToLower() -ne $pkg.binary_sha256) { throw 'sidecar hash mismatch' }
          if ((Get-FileHash $pkg.python -Algorithm SHA256).Hash.ToLower() -ne $pkg.python_sha256) { throw 'packaged Python hash mismatch' }
          "QA_PACKAGED_PYTHON=$($pkg.python)" >> $env:GITHUB_ENV
          "QA_SIDECAR=$($pkg.binary)" >> $env:GITHUB_ENV
          "QA_SIDECAR_SHA=$($pkg.binary_sha256)" >> $env:GITHUB_ENV
          "QA_PACKAGED_PYTHON_SHA=$($pkg.python_sha256)" >> $env:GITHUB_ENV
          $route=Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1
          $nic=Get-NetIPAddress -AddressFamily IPv4 -InterfaceIndex $route.InterfaceIndex | Where-Object { $_.IPAddress -notmatch '^(127\.|169\.254\.)' } | Select-Object -First 1
          if (-not $nic) { throw 'no concrete same-host NIC IPv4 address' }
          "QA_NIC_IPV4=$($nic.IPAddress)" >> $env:GITHUB_ENV
      - name: Qualify actual interpreter receiver matrices and guard lifecycle
        shell: pwsh
        run: |
          python control/tools/qa356/windows_wfp_probe.py --guard test-results/windows-wfp/qa356-wfp-guard.exe --packaged-python "$env:QA_PACKAGED_PYTHON" --packaged-python-sha256 "$env:QA_PACKAGED_PYTHON_SHA" --sidecar "$env:QA_SIDECAR" --sidecar-sha256 "$env:QA_SIDECAR_SHA" --nic-ipv4 "$env:QA_NIC_IPV4" --results test-results/windows-wfp
          if ($LASTEXITCODE -ne 0) { throw 'native WFP qualification failed' }
      - name: Run packaged profile and Code worker inside the same three-image WFP policy
        shell: pwsh
        env:
          QA_OUT: ${{ github.workspace }}\test-results\platform
          QA_WHEEL: ${{ env.QA_WHEEL }}
          QA_WHEEL_SHA: ${{ env.QA_WHEEL_SHA }}
          QA_MANIFEST: ${{ env.QA_MANIFEST }}
          QA_SITE: ${{ env.QA_SITE }}
        run: |
          python control/tools/qa356/run_windows_native_smoke.r1.py --guard test-results/windows-wfp/qa356-wfp-guard.exe --results test-results/windows-wfp
          if ($LASTEXITCODE -ne 0) { throw 'guarded native package smoke failed' }
      - name: Record native auth scan and upload gate
        id: auth_scan
        if: always()
        shell: pwsh
        run: |
          $status='FAIL'
          try {
            @'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('test-results')
          paths=[]
          for p in root.rglob('*'):
              if p.is_file() and not {'home','journal-verification-copy'}.intersection(p.parts): paths.append(p)
          token=b'sentinel-native-profile-smoke'
          rows=[]; matches=[]
          for p in paths:
              data=p.read_bytes()
              rows.append({'path':p.as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              if token in data: matches.append(p.as_posix())
          if not rows: raise RuntimeError('no intended upload files')
          if matches: raise RuntimeError('native auth sentinel found in upload bytes: '+','.join(matches))
          pathlib.Path('test-results/windows-wfp/auth-scan-result.json').write_text(json.dumps({'status':'PASS','secret_values':1,'scanned_files':len(rows),'matches':0,'files':rows},indent=2)+'\n')
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'native auth byte scan failed' }
            $status='PASS'
          } catch {
            New-Item -ItemType Directory -Force test-results/windows-wfp | Out-Null
            @{status='FAIL';reason='scan_failed_or_unknown';secret_values=1;scanned_files=0;matches=0} | ConvertTo-Json | Set-Content test-results/windows-wfp/auth-scan-result.json
            $_ | Out-String | Set-Content test-results/windows-wfp/auth-scan-error.txt
          }
          if ($status -eq 'PASS') { 'pass=true' >> $env:GITHUB_OUTPUT }
          else { 'pass=false' >> $env:GITHUB_OUTPUT; throw 'native auth scan failed; full evidence upload blocked' }
      - name: Upload full Windows qualification only after auth scan passes
        if: always() && steps.auth_scan.outputs.pass == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-windows-native-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: |
            test-results/**
            !**/home/**
            !**/journal-verification-copy/**
      - name: Upload narrow safe Windows status on any scan failure
        if: always() && steps.auth_scan.outputs.pass != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-windows-native-safe-status-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: test-results/windows-wfp/auth-scan-result.json
