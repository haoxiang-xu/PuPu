      - name: Stop pcap, redact requests and gate every upload on actual auth scan
        id: auth_scan
        if: always()
        shell: bash
        run: |
          set +x
          mkdir -p test-results/status
          P=test-results/app/loopback.pcap
          RESULT=test-results/status/auth-scan-result.json
          trap 'rm -f "$P"' EXIT
          if [[ ! -s "$P" ]]; then
            printf '{"status":"NOT_RUN","reason":"capture_missing","secret_values":0,"scanned_files":0}\n' > "$RESULT"
