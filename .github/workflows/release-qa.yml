      - name: Scan and preserve the sealed Linux App before execution
        id: sealed_app_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,posixpath,re,tarfile
          paths=[pathlib.Path('reusable/linux-unpacked.tgz'),pathlib.Path('reusable/linux-unpacked.tgz.sha256'),
            pathlib.Path('reusable/linux-app-file-inventory.json'),pathlib.Path('test-results/app-files.json'),
            pathlib.Path('test-results/platform/package.json'),pathlib.Path('test-results/platform/build-feature-flags.json'),
            pathlib.Path('test-results/platform/package-lock.sha256'),pathlib.Path('test-results/platform/npm-dependency-tree.json'),
            pathlib.Path('test-results/platform/packaging-byte-evidence.json')]
          secret=re.compile(rb'(?i)(?:x-unchain-auth|authorization|bearer)\s*[:=]\s*[A-Za-z0-9._~+/-]{16,}')
          rows=[]
          def scan_file(f):
