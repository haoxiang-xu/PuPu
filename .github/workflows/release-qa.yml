        id: required_ci_final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,time
          def admission(run, flag):
              assert flag in ('true','false'), 'invalid provisional boolean'
              assert isinstance(run,dict) and {'databaseId','status','conclusion','headSha'} <= run.keys(), 'missing CI metadata'
              assert type(run['databaseId']) is int and run['databaseId']==42264231815, 'wrong CI run'
              assert type(run['headSha']) is str and run['headSha']=='56dd76fdd68956a5652ccbd085b99d95db9f5a28', 'wrong CI head'
              assert type(run['status']) is str and (run['conclusion'] is None or type(run['conclusion']) is str), 'invalid CI metadata type'
              if run['status']=='completed' and run['conclusion']=='success':
                  return 'REQUIRED_CI_SUCCESS'
              if flag=='true' and run['status'] in ('queued','in_progress') and run['conclusion'] in (None,''):
                  return 'PROVISIONAL_PENDING'
              raise AssertionError('required CI state is not admissible')
          initial=json.loads(pathlib.Path('test-results/pair/required-ci-admission.json').read_text())
          while True:
              response=subprocess.run(['gh','run','view','42264231815','--repo','haoxiang-xu/PuPu','--json','databaseId,status,conclusion,headSha'],check=True,capture_output=True,text=True,timeout=30)
              run=json.loads(response.stdout)
              state=admission(run,'false')
              if state=='REQUIRED_CI_SUCCESS':
                  pathlib.Path('test-results/pair/required-ci-final.json').write_text(json.dumps({'admission_mode':initial['admission_mode'],'final_run':run,'required_ci_status':'SUCCESS'},indent=2)+'\n')
