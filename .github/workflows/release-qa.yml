name: 357 exact-pair backend acceptance (QA only)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      wheel_run_id:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_CANDIDATE: ${{ inputs.candidate_sha }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_MANIFEST: sha256:827adc5644e00dbb8e67fe5ecf6f7e88d9f542b1c4aff37744e0311c0acc2fe3
    steps:
      - name: Verify read-only cache authority
        run: |
          case "${ACTIONS_CACHE_MODE:-}" in
            read|none) echo "Cache authority: $ACTIONS_CACHE_MODE" ;;
            "") echo "Cache authority enforced by workflow cache-mode: read; runner telemetry unavailable" ;;
            *) echo "Selected runtime code requires read-only cache authority"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the immutable candidate and QA control
        env:
          CORE: ${{ inputs.core_sha }}
          WHEEL_RUN: ${{ inputs.wheel_run_id }}
        run: |
          set -euo pipefail
          [[ "$QA_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_WHEEL_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WHEEL_RUN" =~ ^[0-9]+$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          mkdir -p test-results
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa357/* > test-results/control-tools.sha256
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - name: Install and verify the canonical wheel without rebuilding it
        env:
          CORE: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL" pytest==9.2.0
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert evidence['source']['revision'] == os.environ['CORE']
          assert evidence['source']['dirty'] is False
          assert evidence['build'] == {'built_once': True, 'wheel_count': 1}
          assert evidence['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          PY
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
      - name: Installed-wheel execution and retained-source boundaries offline
        run: bash control/tools/qa357/run_offline.sh source
      - name: Build one Linux sidecar from the same canonical wheel
        run: |
          set -euo pipefail
          export UNCHAIN_ARTIFACT_PATH="$QA_WHEEL" UNCHAIN_ARTIFACT_EVIDENCE_PATH="$PWD/artifact/unchain-artifact.json"
          export UNCHAIN_BUILD_VENV="$RUNNER_TEMP/357-build-venv" UNCHAIN_PYTHON_BIN="$QA_PYTHON"
          bash candidate/unchain_runtime/scripts/build_unchain_server.sh linux
          sha256sum candidate/unchain_runtime/dist/linux/unchain-server > test-results/sidecar.sha256
      - name: Binary HTTP profile/source/pin/import and cold-read cells offline
        run: bash control/tools/qa357/run_offline.sh binary
      - name: Upload exact-pair evidence and reusable binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 357-pair-backend-evidence
          if-no-files-found: error
          path: |
            test-results/**
            artifact/unchain-artifact.json
            control/tools/qa357/*
            candidate/unchain_runtime/dist/linux/unchain-server
