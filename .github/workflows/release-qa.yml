            $eol=(git -C $repoPath config --get core.eol).Trim()
            if ($LASTEXITCODE -ne 0) { throw "effective core.eol readback failed for $repoPath" }
            $localAuto=git -C $repoPath config --local --get core.autocrlf 2>$null
            $localAutoExit=$LASTEXITCODE
            if ($localAutoExit -ne 0) { $localAuto=$null } else { $localAuto=([string]$localAuto).Trim() }
            $localEol=git -C $repoPath config --local --get core.eol 2>$null
            $localEolExit=$LASTEXITCODE
            if ($localEolExit -ne 0) { $localEol=$null } else { $localEol=([string]$localEol).Trim() }
            $effective[$entry.Key]=@{path=$repoPath;local=@{core_autocrlf=$localAuto;core_eol=$localEol};effective=@{core_autocrlf=$auto;core_eol=$eol}}
            if ($auto -ne 'false' -or $eol -ne 'lf') { $settingsValid=$false }
          }
          @{phase='after-checkouts';global=@{core_autocrlf=$globalAutocrlf;core_eol=$globalEol};repositories=$effective} | ConvertTo-Json -Depth 8 | Set-Content test-results/platform/git-line-ending-effective.json
          if (-not $settingsValid) { throw 'one or more checkouts do not have the required effective Git line-ending policy' }
