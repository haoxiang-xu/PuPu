name: "#356 root/child final-event Linux probe (QA only)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  root-final-one-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASELINE_SHA: 93ea8095c5232d7e409d8af2ca3d0278c2815ba7
      BASELINE_TREE: 2d6fadab510b57c09ebd3b62640398cdb606b57f
      CANDIDATE_SHA: fcf6160b0c05bf36d458e5d63c999c1737e5b975
      CANDIDATE_TREE: d7b29221efc7304ea9e9df3880c763ae8177f8f9
      WHEEL_RUN_ID: "41976372220"
      WHEEL_SHA256: a93e989eb8de0fedf2b77a99296bdf81af41ad82f0981d0ba19179f329487146
      MANIFEST_DIGEST: sha256:88d5f8d733e7f3dc94fb1cd20060fcc5f2611c0f94420e327bcb12664368bf2e
      LEGACY_RUN_ID: "41263562114"
    steps:
      - name: Initialize fail-closed evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/safe-status
          printf '%s\n' '{"status":"NOT_RUN","reason":"qualification_not_started"}' > test-results/safe-status/workflow-status.json

      - name: Check out QA controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Check out baseline source
        uses: actions/checkout@v4
        with:
          ref: 93ea8095c5232d7e409d8af2ca3d0278c2815ba7
          path: baseline
          persist-credentials: false
          fetch-depth: 1

      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: fcf6160b0c05bf36d458e5d63c999c1737e5b975
          path: candidate
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact source delta and frozen refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse 'HEAD^{tree}')" = "$BASELINE_TREE"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git -C candidate diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA" > test-results/source-delta.txt
          test "$(cat test-results/source-delta.txt)" = "unchain_runtime/server/tests/test_skeleton_production_routes.py"
          git -C baseline diff --quiet
          git -C candidate diff --quiet
          printf '{"baseline":"%s","baseline_tree":"%s","candidate":"%s","candidate_tree":"%s","changed_paths":["%s"]}\n' "$BASELINE_SHA" "$BASELINE_TREE" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$(cat test-results/source-delta.txt)" > test-results/source-refs.json

      - name: Download and verify the canonical wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$WHEEL_RUN_ID" --repo haoxiang-xu/PuPu --json status,conclusion,headSha > test-results/wheel-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.load(open('test-results/wheel-run.json'))
          assert r['status'] == 'completed' and r['conclusion'] == 'failure', r
          assert r['headSha'] == os.environ['BASELINE_SHA'], r
          Path('test-results/wheel-run-classification.json').write_text(json.dumps({'classification':'DIAGNOSTIC_ONLY','required_ci_conclusion':'failure','release_qualification':False,'run':r},indent=2)+'\n')
          PY
          mkdir -p inputs/wheel
          gh run download "$WHEEL_RUN_ID" --repo haoxiang-xu/PuPu --name unchain-release-artifact --dir inputs/wheel
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          wheels = list(Path('inputs/wheel').rglob('*.whl'))
          assert len(wheels) == 1, [str(p) for p in wheels]
          assert wheels[0].name == 'unchain-0.2.0-py3-none-any.whl', wheels[0].name
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          assert digest == os.environ['WHEEL_SHA256'], digest
          manifests = list(Path('inputs/wheel').rglob('unchain-artifact.json'))
          assert len(manifests) == 1, [str(p) for p in manifests]
          artifact = json.loads(manifests[0].read_text())
          assert artifact['artifact']['sha256'] == 'sha256:' + digest
          assert artifact['runtime_manifest']['manifest_digest'] == os.environ['MANIFEST_DIGEST']
          assert artifact['source']['revision'] == '82c964f40ddb077cc89f4cd8c16db9afa29952a7'
          assert artifact['source']['dirty'] is False
          assert artifact['build']['wheel_count'] == 1 and artifact['build']['built_once'] is True
          Path('test-results/wheel.json').write_text(json.dumps({'path':str(wheels[0]),'sha256':digest,'manifest_digest':artifact['runtime_manifest']['manifest_digest'],'source':artifact['source'],'build':artifact['build']},indent=2)+'\n')
          PY

      - name: Set up Python and install the pinned runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install wheel dependencies and pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -r candidate/unchain_runtime/server/requirements.txt
          wheel="$(find inputs/wheel -name '*.whl' -type f -print -quit)"
          .venv/bin/python -m pip install --constraint candidate/unchain_runtime/server/requirements.txt "$wheel" pytest==9.2.0
          .venv/bin/python -m pip check
          .venv/bin/python -m pip freeze > test-results/pip-freeze.txt

      - name: Run the same single selector against baseline then candidate
        shell: bash
        env:
          QA_CONTROL: ${{ github.workspace }}/control/tools/qa356
          QA_OUT: ${{ github.workspace }}/test-results
          QA_VENV_PYTHON: ${{ github.workspace }}/.venv/bin/python
          QA_BASELINE: ${{ github.workspace }}/baseline
          QA_CANDIDATE: ${{ github.workspace }}/candidate
          QA_BASELINE_SHA: ${{ env.BASELINE_SHA }}
          QA_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          QA_WHEEL_SHA: ${{ env.WHEEL_SHA256 }}
          QA_MANIFEST: ${{ env.MANIFEST_DIGEST }}
        run: |
          set -euo pipefail
          wheel="$(find inputs/wheel -name '*.whl' -type f -print -quit)"
          export QA_WHEEL="$GITHUB_WORKSPACE/$wheel"
          sudo apt-get update
          sudo apt-get install -y iproute2 util-linux
          bash control/tools/qa356/run_root_final_route.sh
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test-results/qualification-result.json')
          result=json.loads(p.read_text())
          assert result['status']=='PASS', result
          Path('test-results/safe-status/workflow-status.json').write_text(json.dumps({'status':'PASS','reason':'baseline-red-candidate-green'})+'\n')
          PY

      - name: Scan every evidence file for credentials before upload
        id: authscan
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root=Path('test-results')
          token=os.environ.get('GH_TOKEN','').encode()
          patterns=[re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,}'), re.compile(rb'github_pat_[A-Za-z0-9_]{20,}'), re.compile(rb'(?i)bearer\s+[A-Za-z0-9._~+/=-]{16,}')]
          fixture=b'skeleton-route-auth'
          findings=[]; redactions=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name=='auth-scan.json': continue
              raw=p.read_bytes(); updated=raw.replace(fixture,b'[known-test-fixture-redacted]')
              if updated != raw:
                  redactions.append({'path':str(p),'before_sha256':hashlib.sha256(raw).hexdigest(),'after_sha256':hashlib.sha256(updated).hexdigest()})
                  p.write_bytes(updated)
              if token and token in updated: findings.append({'path':str(p),'kind':'workflow-token'})
              if any(pattern.search(updated) for pattern in patterns): findings.append({'path':str(p),'kind':'credential-pattern'})
          record={'status':'PASS' if not findings else 'FAIL','scanned_files':sum(p.is_file() for p in root.rglob('*')),'findings':findings,'fixture_redactions':redactions}
          (root/'auth-scan.json').write_text(json.dumps(record,indent=2)+'\n')
          if findings:
              (root/'safe-status/workflow-status.json').write_text('{"status":"FAIL","reason":"credential_scan_failed"}\n')
          raise SystemExit(0 if not findings else 1)
          PY

      - name: Upload scanned qualification evidence
        if: always() && steps.authscan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: root-final-one-selector-${{ github.run_id }}
          path: |
            test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload only safe status when credential scan fails
        if: always() && steps.authscan.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: root-final-one-selector-safe-status-${{ github.run_id }}
          path: test-results/safe-status/workflow-status.json
          if-no-files-found: error
          retention-days: 7
