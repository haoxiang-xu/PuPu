name: "#356 B1 measurement (QA only, non-delivery)"

# QA-only branch: replaces release-qa.yml so this one measurement can be
# dispatched. Not for merge. It runs one test case, A -> B -> A, on one
# hosted Linux runner, with the same Python and the same third-party set:
#   A = Host 333643e8 + historical wheel 17b04aea (comparison only)
#   B = Host 762c44c9 + current fixed wheel 949a8947
# No wheel is rebuilt, nothing is changed in either Host tree, and the PR CI
# diagnostic setting (faulthandler_timeout=60) is kept.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  b1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST_A: 333643e82efc5a957ec358ca766b34c635ceaa68
      HOST_B: 762c44c9450166ae94c5d0322b7a016df8caa649
      WHEEL_A_RUN: "41262234256"
      WHEEL_A_SHA: 17b04aea25489e72eb4e6ab03a131f470bdcddf65f9e8a4eec757d9bfcbfe47c
      WHEEL_B_RUN: "41551271360"
      WHEEL_B_SHA: 949a89475894b13ac324b90671c714ccd3125509cf6b313df739c66dc8292de6
      CASE: "tests/test_skeleton_hook_approval_regressions.py::test_published_hook_projects_each_distinct_child_approval[1-2-1]"
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HOST_A }}
          path: hostA
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HOST_B }}
          path: hostB
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: wheelA
          run-id: ${{ env.WHEEL_A_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: wheelB
          run-id: ${{ env.WHEEL_B_RUN }}
          github-token: ${{ github.token }}

      - name: Bind identities and the two retained wheels (not rebuilt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(git -C hostA rev-parse HEAD)" = "$HOST_A"
          test "$(git -C hostB rev-parse HEAD)" = "$HOST_B"
          echo "$WHEEL_A_SHA  wheelA/unchain-0.2.0-py3-none-any.whl" | sha256sum -c -
          echo "$WHEEL_B_SHA  wheelB/unchain-0.2.0-py3-none-any.whl" | sha256sum -c -
          cmp hostA/unchain_runtime/server/requirements.txt hostB/unchain_runtime/server/requirements.txt
          cmp hostA/unchain_runtime/server/tests/test_skeleton_hook_approval_regressions.py hostB/unchain_runtime/server/tests/test_skeleton_hook_approval_regressions.py \
            && echo "test file identical in A and B" > out/test-file-identity.txt
          cmp hostA/unchain_runtime/server/tests/conftest.py hostB/unchain_runtime/server/tests/conftest.py \
            && echo "conftest identical in A and B" >> out/test-file-identity.txt || echo "conftest differs between A and B" >> out/test-file-identity.txt
          { echo "control=$(git -C control rev-parse HEAD)"; echo "host_a=$HOST_A"; echo "host_b=$HOST_B"; sha256sum wheelA/*.whl wheelB/*.whl; python --version; uname -a; nproc; free -m; } > out/identity.txt
          cat out/identity.txt

      - name: Two environments with the same third-party set
        shell: bash
        run: |
          set -euo pipefail
          python -m venv venvB
          venvB/bin/python -m pip install --disable-pip-version-check -q --retries 5 --timeout 60 --upgrade pip
          venvB/bin/python -m pip install --disable-pip-version-check -q --retries 5 --timeout 60 -r hostB/unchain_runtime/server/requirements.txt pytest wheelB/unchain-0.2.0-py3-none-any.whl
          venvB/bin/python -m pip freeze --all | grep -v -i '^unchain' > out/third-party-freeze.txt
          python -m venv venvA
          venvA/bin/python -m pip install --disable-pip-version-check -q --retries 5 --timeout 60 --upgrade pip
          venvA/bin/python -m pip install --disable-pip-version-check -q --retries 5 --timeout 60 -r out/third-party-freeze.txt
          venvA/bin/python -m pip install --disable-pip-version-check -q --no-deps wheelA/unchain-0.2.0-py3-none-any.whl
          for v in A B; do
            venv$v/bin/python -m pip freeze --all > out/freeze-$v.txt
            venv$v/bin/python -m pip check > out/pip-check-$v.txt 2>&1 || echo "pip check $v exit $?" >> out/pip-check-$v.txt
          done
          diff <(grep -v -i '^unchain' out/freeze-A.txt) <(grep -v -i '^unchain' out/freeze-B.txt) > out/third-party-diff.txt && echo "third-party sets identical" >> out/third-party-diff.txt
          cat out/third-party-diff.txt out/pip-check-A.txt out/pip-check-B.txt
          grep -i '^unchain' out/freeze-A.txt out/freeze-B.txt

      - name: Measure A -> B -> A, serially, one case each
        shell: bash
        run: |
          set -uo pipefail
          run() {
            local label="$1" side="$2"
            local host="$PWD/host$side" venv="$PWD/venv$side" wheel="$PWD/wheel$side/unchain-0.2.0-py3-none-any.whl"
            ( cd "$host/unchain_runtime/server" && \
              PYTHONPATH="$GITHUB_WORKSPACE/control/tools/qa356_b1" QA356_B1_OUT="$GITHUB_WORKSPACE/out/$label.json" QA356_B1_WHEEL="$wheel" \
              "$venv/bin/python" -m pytest "$CASE" -vv --tb=short --durations=25 -o faulthandler_timeout=60 -p qa356_b1_probe -p no:cacheprovider \
              > "$GITHUB_WORKSPACE/out/$label.log" 2>&1 )
            echo "$label exit=$?" | tee -a out/exits.txt
            tail -5 "out/$label.log"
          }
          run 1-A A
          run 2-B B
          run 3-A A

      - name: Summary
        if: always()
        shell: bash
        run: |
          python - <<'EOF'
          import json, glob, os
          rows = []
          for path in sorted(glob.glob("out/[0-9]-*.json")):
              d = json.load(open(path))
              case = next(iter(d["phases"].values()), {})
              hb = d["heartbeat_threads"]
              rows.append({
                  "run": os.path.basename(path)[:-5],
                  "exit": d["exitstatus"],
                  "call_wall_s": case.get("call", {}).get("wall"),
                  "call_cpu_s": case.get("call", {}).get("process_time"),
                  "setup_wall_s": case.get("setup", {}).get("wall"),
                  "teardown_wall_s": case.get("teardown", {}).get("wall"),
                  "heartbeat_threads_seen": len(hb),
                  "heartbeat_alive_at_session_finish": len(d["snapshots"][-1]["heartbeat_alive"]),
                  "heartbeat_alive_after_teardown_2s": next((len(s["heartbeat_alive"]) for s in d["snapshots"] if s["label"] == "after-teardown+2s"), None),
                  "imported": d["imported_runtime"]["unchain_file"],
                  "wheel_match": {k: (v if isinstance(v, int) else len(v)) for k, v in d["imported_runtime"]["wheel_match"].items()},
              })
          json.dump(rows, open("out/summary.json", "w"), indent=1)
          print(json.dumps(rows, indent=1))
          EOF

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa356-b1-measurement
          if-no-files-found: error
          path: out/**
