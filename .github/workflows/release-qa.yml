name: 357 actual packaged execution (QA only)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        default: 18178a0611f50522f69fbd1d4841965bfbb0d016
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
jobs:
  app_execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_MANIFEST: sha256:827adc5644e00dbb8e67fe5ecf6f7e88d9f542b1c4aff37744e0311c0acc2fe3
    steps:
      - name: Verify read-only cache authority
        run: |
          case "${ACTIONS_CACHE_MODE:-}" in
            read|none) echo "Cache authority: $ACTIONS_CACHE_MODE" ;;
            "") echo "Read authority enforced by workflow cache-mode" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
      - name: Bind source inputs and tools
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p test-results/execution
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa357/* > test-results/control-tools.sha256
          sha256sum candidate/package-lock.json > test-results/package-lock.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: 41262234256
          github-token: ${{ github.token }}
      - name: Install and verify the existing wheel
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "17b04aea25489e72eb4e6ab03a131f470bdcddf65f9e8a4eec757d9bfcbfe47c  $WHEEL" | sha256sum -c -
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          python -m pip install --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL"
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" \
            --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert d['source']['revision'] == 'e0d2eb5e09976def467da7f32f2b0482b48c2ffd'
          assert d['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          assert d['build'] == {'built_once': True, 'wheel_count': 1}
          PY
          python -m pip freeze > test-results/pip-freeze.txt
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Qualify the deployed App tool projection adapter
        run: python -I -B control/tools/qa357/test_app_projection.py > test-results/app-projection-controls.log 2>&1
      - name: Install fresh locked Node and Linux prerequisites
        run: |
          set -euo pipefail
          npm --prefix candidate ci
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools xvfb openssl
          candidate/node_modules/.bin/playwright install-deps chromium
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const binary = require('./candidate/node_modules/electron');
          assert.equal(binary, path.resolve('candidate/node_modules/electron/dist/electron'));
          assert(fs.lstatSync(binary).isFile());
          const helper = path.join(path.dirname(binary), 'chrome-sandbox');
          assert(fs.lstatSync(helper).isFile());
          fs.accessSync(helper, fs.constants.X_OK);
          fs.appendFileSync(process.env.GITHUB_ENV, `QA_ELECTRON=${binary}\n`);
          JS
          sudo chown root:root candidate/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 candidate/node_modules/electron/dist/chrome-sandbox
          set +e
          npm --prefix candidate ls --all --json > test-results/npm-ls.json 2> test-results/npm-ls.stderr
          inventory_exit=$?
          set -e
          printf '%s\n' "$inventory_exit" > test-results/npm-ls-exit.txt
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const tree = JSON.parse(fs.readFileSync('test-results/npm-ls.json'));
          const code = Number(fs.readFileSync('test-results/npm-ls-exit.txt', 'utf8'));
          if (code !== 0) {
            // Inventory is provenance, not a new clean-peer gate. Retain and
            // precisely register the existing locked diagnostic; no other
            // npm failure is accepted and no dependency is modified.
            assert.equal(code, 1);
            assert.deepEqual(tree.problems, ['invalid: yaml@1.10.3 ' + path.resolve('candidate/node_modules/yaml')]);
            assert.equal(require('./candidate/package-lock.json').packages['node_modules/yaml'].version, '1.10.3');
            console.log('Registered existing locked yaml inventory diagnostic; npm ci and lock integrity remain required.');
          }
          JS
          sha256sum -c test-results/package-lock.sha256
      - uses: actions/download-artifact@v4
        with:
          name: 357-pair-backend-evidence
          path: fixed-sidecar
          run-id: 41263562114
          github-token: ${{ github.token }}
      - name: Overlay only QA drivers and reuse the exact sidecar
        run: |
          set -euo pipefail
          mkdir -p candidate/e2e/qa357 candidate/unchain_runtime/dist/linux
          cp control/e2e/qa357/*.js candidate/e2e/qa357/
          cp control/e2e/pupu-357-execution.spec.js candidate/e2e/
          BINARY=fixed-sidecar/candidate/unchain_runtime/dist/linux/unchain-server
          echo "e0162fc116e3f2970c67bc6c5458d1a305e6404dbb11b6e22db25897cad77ff6  $BINARY" | sha256sum -c -
          cp "$BINARY" candidate/unchain_runtime/dist/linux/unchain-server
          chmod 755 candidate/unchain_runtime/dist/linux/unchain-server
          for file in control/tools/qa357/*.sh; do bash -n "$file"; done
          for file in control/e2e/qa357/*.js control/e2e/pupu-357-execution.spec.js; do node --check "$file"; done
      - name: Package the explicit candidate around the fixed binary
        working-directory: candidate
        run: |
          set -euo pipefail
          export PUPU_BUILD_VERSION="$(node -p 'require("./package.json").version')"
          export PUPU_BUILD_FEATURE_SNAPSHOT_PATH="$RUNNER_TEMP/qa357-execution-build-flags.json"
          printf '%s\n' '{"enable_user_access_to_agents":true,"enable_user_access_to_characters":false,"enable_custom_model_providers":true,"enable_computer_use":false}' > "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH"
          cp "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH" ../test-results/build-feature-flags.input.json
          npm run build:web
          cp build/build_feature_flags.json ../test-results/build-feature-flags.packaged.json
          npm run notices
          node_modules/.bin/electron-builder --linux dir --publish never
          BINARY=dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server
          echo "e0162fc116e3f2970c67bc6c5458d1a305e6404dbb11b6e22db25897cad77ff6  $BINARY" | sha256sum -c -
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",(p.build&&p.build.linux&&p.build.linux.executableName)||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "PUPU_357_APP_EXECUTABLE=$EXE" >> "$GITHUB_ENV"
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          stat -c '%U %a %n' dist/linux-unpacked/chrome-sandbox > ../test-results/original-chromium-sandbox.txt
          (cd .. && sha256sum -c test-results/package-lock.sha256)
      - name: Retain full packaged bytes and input provenance
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import hashlib, json
          app = Path('candidate/dist/linux-unpacked').resolve()
          rows = []
          for p in sorted(app.rglob('*')):
              if p.is_symlink():
                  p.resolve().relative_to(app)
                  rows.append({'path':str(p.relative_to(app)), 'link':str(p.readlink())})
              elif p.is_file():
                  rows.append({'path':str(p.relative_to(app)), 'bytes':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('test-results/full-app-manifest.json').write_text(json.dumps(rows, indent=2))
          PY
      - name: Run actual UI send and Hook approval with only local verified TLS
        run: |
          set -euo pipefail
          export QA_OUT="$PWD/test-results/execution"
          export QA_CANDIDATE_ROOT="$PWD/candidate"
          bash control/tools/qa357/run_packaged_execution.sh
      - name: Check actual request sequence without claiming physical acceptance
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          out = Path('test-results/execution')
          rows = [json.loads(x) for x in (out/'provider-requests.jsonl').read_text().splitlines()]
          assert len(rows) == 2 and all(x['refusal'] is None for x in rows)
          assert [x['phase_after'] for x in rows] == ['awaiting_output','completed']
          for row in rows:
              assert row['peer'] == '127.0.0.1'
              for kind in ['request','response']:
                  assert hashlib.sha256(base64.b64decode(row[kind+'_base64'])).hexdigest() == row[kind+'_sha256']
          assert {x['ifname'] for x in json.loads((out/'offline-interfaces.json').read_text())} == {'lo'}
          assert json.loads((out/'offline-routes.json').read_text()) == []
          print('GUI + native wire gates passed; independent physical Journal/CAS review remains PENDING')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 357-packaged-execution-evidence
          retention-days: 90
          if-no-files-found: error
          # The disposable App store is .pupu below the bounded test-results
          # copy. No CA keys/private keyring directory is copied into this root.
          include-hidden-files: true
          path: |
            test-results/**
            candidate/test-results/**
            artifact/unchain-artifact.json
            control/tools/qa357/**
            control/e2e/qa357/**
            control/e2e/pupu-357-execution.spec.js
            control/docs/implementation/ticket-357-packaged-execution-qa.md
