              blob=b''.join(parts[seq] for seq in sorted(parts))
              for match in re.finditer(rb'(?im)^x-unchain-auth:[ \t]*([^\r\n]+)',blob):
                  value=match.group(1).strip()
                  if value: values.add(value)
          roots=[pathlib.Path('test-results'),pathlib.Path('reusable')]
          excluded={'home','journal-verification-copy'}; files=[]
          for root in roots:
              if not root.exists(): continue
              for f in root.rglob('*'):
                  if f.is_file() and not excluded.intersection(f.parts) and f != capture: files.append(f)
          matches=[]
          for f in files:
              content=f.read_bytes()
              for value in values:
                  if value in content: matches.append(f.as_posix())
          status='PASS' if values and not matches else 'FAIL'
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'status':status,'secret_values':len(values),
