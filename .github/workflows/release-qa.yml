              raise RuntimeError('tar_inventory_member_set_mismatch:'+json.dumps({'missing':sorted(set(inventory)-seen),'extra':sorted(seen-set(inventory))}))
          pathlib.Path('reusable/linux-app-seal-scan.json').write_text(json.dumps({
            'status':'PASS','files':rows,'tar_sha256':hashlib.file_digest(tar_path.open('rb'),'sha256').hexdigest(),
            'tar_members_verified':member_count,'tar_directories_verified':len(dirs),'regular_member_bytes_scanned':content_bytes,
