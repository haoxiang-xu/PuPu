name: Release QA

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      qa_mode:
        description: "QA mode"
        type: choice
        options:
          - lite
          - release
          - release-candidate
        default: lite
      run_unchain_analysis:
        description: "Run optional Unchain advisory analysis"
        type: boolean
        default: true
      unchain_ref:
        description: "Unchain source ref selected once for the immutable release artifact (release-candidate requires a full 40-character revision)"
        type: string
        default: dev

permissions:
  contents: read
  actions: read

jobs:
  deterministic-checks:
    name: Deterministic QA
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_shared-release-deterministic.yml
    with:
      qa_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qa_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'lite' }}
      unchain_ref: ${{ github.event.inputs.unchain_ref || 'dev' }}
      source_ref: ${{ github.ref }}
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  release-candidate-environment-preflight:
    name: Release candidate environment preflight
    needs: deterministic-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      QA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.qa_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'lite' }}
    steps:
      - name: Set up Node for release environment verifier
        if: env.QA_MODE == 'release-candidate'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout release environment verifier
        if: env.QA_MODE == 'release-candidate'
        uses: actions/checkout@v4

      - name: Require protected release-signing Environment
        if: env.QA_MODE == 'release-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release-signing" \
            | node scripts/release-qa/verify-github-environment.mjs --environment release-signing

  playwright-electron:
    name: Playwright Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.qa_mode != 'lite') || (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/_shared-release-playwright.yml
    with:
      qa_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qa_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'lite' }}
      runner_selector: ${{ matrix.os }}
      source_ref: ${{ github.ref }}
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  package-matrix:
    name: Package ${{ matrix.name }}
    needs:
      - deterministic-checks
      - release-candidate-environment-preflight
    if: ${{ needs.deterministic-checks.result == 'success' && needs.release-candidate-environment-preflight.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.qa_mode != 'lite') || (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            target_id: macos-arm64
            signing_platform: macos
          - name: mac-intel
            target_id: macos-x64
            signing_platform: macos
          - name: windows
            target_id: windows-x64
            signing_platform: windows
          - name: linux
            target_id: linux-x64
            signing_platform: linux
    uses: ./.github/workflows/_shared-release-package.yml
    with:
      qa_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qa_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'lite' }}
      target_id: ${{ matrix.target_id }}
      platform_name: ${{ matrix.name }}
      signing_platform: ${{ matrix.signing_platform }}
      unchain_ref: ${{ github.event.inputs.unchain_ref || 'dev' }}
      source_ref: ${{ github.ref }}
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
  final-report:
    name: Final Release QA Report
    if: ${{ always() }}
    needs:
      - deterministic-checks
      - playwright-electron
      - package-matrix
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_shared-release-report.yml
    with:
      qa_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qa_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'lite' }}
      source_ref: ${{ github.ref }}
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      deterministic_result: ${{ needs.deterministic-checks.result }}
      playwright_result: ${{ needs.playwright-electron.result }}
      package_result: ${{ needs.package-matrix.result }}
      run_unchain_analysis: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.qa_mode == 'release' && github.event.inputs.run_unchain_analysis }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
