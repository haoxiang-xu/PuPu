          python - "$P" "$RESULT" <<'PY'
          import hashlib,json,pathlib,re,struct,sys
          capture=pathlib.Path(sys.argv[1]); raw=capture.read_bytes()
          magic=struct.unpack('<I',raw[:4])[0]
