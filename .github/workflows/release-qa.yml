  windows-native:
    if: inputs.scope == 'windows-native'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QA_EXPECTED_HOST_SHA: fa162b3d94791fad36da85f4a00ff36ecf758853
      QA_EXPECTED_HOST_TREE: 9ac15003c6fdabb2928be0e3f5d61ff6d47e386d
      QA_CORE_SHA: 369d86cc9592704c6d45017147904bf6e103a37f
      QA_CORE_TREE: 18edaf62bb41ebade4457480f1edc89af4c6780b
      QA_HOST_SHA: ${{ inputs.candidate_sha }}
      QA_HOST_TREE: ${{ inputs.candidate_tree }}
      QA_WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
    steps:
      - name: Fail closed until final Host and wheel are frozen
        shell: pwsh
        run: |
          if ($env:QA_EXPECTED_HOST_SHA -notmatch '^[0-9a-f]{40}$' -or $env:QA_HOST_SHA -ne $env:QA_EXPECTED_HOST_SHA) { throw 'root must freeze exact Host SHA before dispatch' }
          if ($env:QA_EXPECTED_HOST_TREE -notmatch '^[0-9a-f]{40}$' -or $env:QA_HOST_TREE -ne $env:QA_EXPECTED_HOST_TREE) { throw 'root must freeze exact Host tree before dispatch' }
          if ($env:QA_WHEEL_RUN_ID -notmatch '^[0-9]+$' -or $env:QA_WHEEL_SHA -notmatch '^[0-9a-f]{64}$') { throw 'required CI wheel identity is incomplete' }
          if ($env:QA_CORE_SHA -ne '369d86cc9592704c6d45017147904bf6e103a37f' -or $env:QA_CORE_TREE -ne '18edaf62bb41ebade4457480f1edc89af4c6780b') { throw 'Core identity mismatch' }
          New-Item -ItemType Directory -Force test-results/windows-wfp,test-results/platform,artifact | Out-Null
      - name: Set exact-source Git line-ending defaults before checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'global core.autocrlf configuration failed' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'global core.eol configuration failed' }
          $autocrlf=(git config --global --get core.autocrlf).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'global core.autocrlf readback failed' }
          $eol=(git config --global --get core.eol).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'global core.eol readback failed' }
          if ($autocrlf -ne 'false' -or $eol -ne 'lf') { throw 'global Git line-ending policy did not take effect' }
          @{phase='before-checkouts';global=@{core_autocrlf=$autocrlf;core_eol=$eol}} | ConvertTo-Json -Depth 4 | Set-Content test-results/platform/git-line-ending-global.json
      - name: Check out QA controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Check out exact Host and Core
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/PuPu
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact Core source
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: 369d86cc9592704c6d45017147904bf6e103a37f
          path: core
          persist-credentials: false
      - name: Download the one final required-CI wheel
        uses: actions/download-artifact@v4
