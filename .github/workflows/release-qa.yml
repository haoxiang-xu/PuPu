name: "#356 Linux source qualification (QA only, non-delivery)"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: One serial qualification lane
        required: true
        type: choice
        options: [source, pair, windows-native]
        default: source
      allow_provisional_pair:
        description: Allow provisional Linux pair execution pending exact required CI; final success remains mandatory
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: Full frozen Host source SHA
        required: true
        type: string
        default: fa162b3d94791fad36da85f4a00ff36ecf758853
      candidate_tree:
        description: Full frozen Host tree
        required: true
        type: string
        default: 9ac15003c6fdabb2928be0e3f5d61ff6d47e386d
      wheel_run_id:
        description: Canonical successful required-CI run that uploaded the single wheel
        required: true
        type: string
        default: "42138839492"
      wheel_sha256:
        description: SHA256 of the one required-CI wheel artifact
        required: true
        type: string
        default: 21f5a0794dfeb0f4d28476b3d7d6851453540b8baa4791684bf03beac4e84461
      legacy_run_id:
        description: Canonical frozen run holding the old e0162fc1 binary
        required: true
        type: string
        default: "41263562114"
      legacy_artifact_name:
        description: Frozen old-binary artifact name
        required: true
        type: string
        default: 357-pair-backend-evidence

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: inputs.scope == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_EXPECTED_CANDIDATE: fa162b3d94791fad36da85f4a00ff36ecf758853
      QA_EXPECTED_CANDIDATE_TREE: 9ac15003c6fdabb2928be0e3f5d61ff6d47e386d
      QA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      QA_CORE_SHA: 33e9552f35e537a03b9cd73cb154d642481162a8
      QA_CORE_TREE: c7b327e243fd8152f869d1349776b066082d5fd9
      QA_WHEEL_SHA: 949a89475894b13ac324b90671c714ccd3125509cf6b313df739c66dc8292de6
      QA_WHEEL_RUN: "41562427104"
    steps:
      - name: Validate the approved full candidate SHA and initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/source
          date -u +%FT%TZ > test-results/source/workflow-start.txt
          cat > test-results/source/source-imports.json <<'JSON'
          {"schema":"qa356.source-imports.v1","status":"NOT_RUN","reason":"runtime_source_import_not_started","modules":[],"errors":[]}
          JSON
          cat > test-results/source/process-identity.json <<'JSON'
          {"status":"NOT_RUN","reason":"source_process_not_started","before":null,"after":null}
          JSON
          cat > test-results/source/external-network-proof.json <<'JSON'
          {"status":"NOT_RUN","reason":"isolated_runtime_not_started","namespace":null,"before":null,"after":null}
          JSON
          cat > test-results/source/qualification-result.json <<'JSON'
          {"schema":"qa356.linux-source-qualification.v1","status":"NOT_RUN","reason":"source_wrapper_not_started","exit_code":null}
          JSON
          cat > test-results/source/acceptance.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="qa356-harness" tests="1" failures="0" errors="1" skipped="0"><testcase classname="qa356.harness" name="source-tests-not-run"><error message="harness-error/NOT_RUN">The isolated source test runner has not started.</error></testcase></testsuite>
          XML
          [[ "$QA_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$QA_CANDIDATE_SHA" = "$QA_EXPECTED_CANDIDATE"

      - name: Check out the QA control branch
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Check out the exact PuPu source checkpoint
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/PuPu
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Check out the exact Core source checkpoint
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: 33e9552f35e537a03b9cd73cb154d642481162a8
          path: core
          persist-credentials: false

      - name: Bind source identities and trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$QA_EXPECTED_CANDIDATE_TREE"
          test "$(git -C core rev-parse HEAD)" = "$QA_CORE_SHA"
          test "$(git -C core rev-parse 'HEAD^{tree}')" = "$QA_CORE_TREE"
          git -C candidate rev-parse HEAD 'HEAD^{tree}' > test-results/source/candidate-identity.txt
          git -C core rev-parse HEAD 'HEAD^{tree}' > test-results/source/core-identity.txt
          sha256sum control/tools/qa356/run_source_offline.sh > test-results/source/control-wrapper.sha256
          {
            printf 'candidate=%s\n' "$QA_CANDIDATE_SHA"
            printf 'candidate_tree=%s\n' "$QA_EXPECTED_CANDIDATE_TREE"
            printf 'core=%s\n' "$QA_CORE_SHA"
            printf 'core_tree=%s\n' "$QA_CORE_TREE"
          } > test-results/source/source-pair.txt

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Download the retained dependency wheel (run 41562427104)
        uses: actions/download-artifact@v4
        with:
          name: 356-runtime-pair-evidence
          path: retained
          run-id: 41562427104
          github-token: ${{ github.token }}

      - name: Verify retained wheel and prepare test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependencies
          WHEEL="$PWD/retained/artifact/unchain-0.2.0-py3-none-any.whl"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          cp "$WHEEL" dependencies/unchain-0.2.0-py3-none-any.whl
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt dependencies/unchain-0.2.0-py3-none-any.whl pytest==9.2.0
          python -m pip check
          python -m pip freeze --all > test-results/source/dependencies-freeze.txt
          sha256sum dependencies/unchain-0.2.0-py3-none-any.whl > test-results/source/dependency-wheel.sha256
          {
            echo "QA_CANDIDATE_ROOT=$GITHUB_WORKSPACE/candidate"
            echo "QA_CORE_ROOT=$GITHUB_WORKSPACE/core/src"
            echo "QA_SERVER=$GITHUB_WORKSPACE/candidate/unchain_runtime/server"
            echo "QA_CONTROL=$GITHUB_WORKSPACE/control/tools/qa356"
            echo "QA_OUT=$GITHUB_WORKSPACE/test-results/source"
            echo "QA_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "QA_SITE=$(python -c 'import site; print(site.getsitepackages()[0])')"
            echo "QA_WHEEL=$GITHUB_WORKSPACE/dependencies/unchain-0.2.0-py3-none-any.whl"
            echo "QA_CANDIDATE_TREE=$QA_EXPECTED_CANDIDATE_TREE"
          } >> "$GITHUB_ENV"

      - name: Run the exact source selectors with real Linux process identity, loopback only
        shell: bash
        run: bash control/tools/qa356/run_source_offline.sh

      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 356-linux-source-qualification-${{ inputs.candidate_sha }}
          if-no-files-found: error
          path: |
            test-results/source/**

  # Added pair/native lanes are a static draft. The source lane above remains the
  # reviewed 901 source job and is not replaced until its immutable run is saved.
  pair:
    if: inputs.scope == 'pair'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QA_ALLOW_PROVISIONAL_PAIR: ${{ inputs.allow_provisional_pair }}
      QA_EXPECTED_HOST_SHA: fa162b3d94791fad36da85f4a00ff36ecf758853
      QA_EXPECTED_HOST_TREE: 9ac15003c6fdabb2928be0e3f5d61ff6d47e386d
      QA_CORE_SHA: 33e9552f35e537a03b9cd73cb154d642481162a8
      QA_CORE_TREE: c7b327e243fd8152f869d1349776b066082d5fd9
      QA_EXPECTED_MANIFEST: sha256:88d5f8d733e7f3dc94fb1cd20060fcc5f2611c0f94420e327bcb12664368bf2e
      QA_HOST_SHA: ${{ inputs.candidate_sha }}
      QA_HOST_TREE: ${{ inputs.candidate_tree }}
      QA_WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
      QA_WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      QA_LEGACY_RUN_ID: ${{ inputs.legacy_run_id }}
      QA_LEGACY_ARTIFACT: ${{ inputs.legacy_artifact_name }}
      QA_LEGACY_SHA: e0162fc116e3f2970c67bc6c5458d1a305e6404dbb11b6e22db25897cad77ff6
    steps:
      - name: Fail closed unless the root has frozen final identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA_EXPECTED_HOST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_EXPECTED_HOST_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QA_HOST_SHA" == "$QA_EXPECTED_HOST_SHA" ]]
          [[ "$QA_HOST_TREE" == "$QA_EXPECTED_HOST_TREE" ]]
          [[ "$QA_CORE_SHA" == 33e9552f35e537a03b9cd73cb154d642481162a8 ]]
          [[ "$QA_CORE_TREE" == c7b327e243fd8152f869d1349776b066082d5fd9 ]]
          [[ "$QA_WHEEL_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$QA_WHEEL_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$QA_LEGACY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$QA_LEGACY_ARTIFACT" == 357-pair-backend-evidence ]]
          mkdir -p test-results/status test-results/pair test-results/platform reusable
          printf 'NOT_RUN\n' > test-results/status/qualification.txt
          date -u +%FT%TZ > test-results/pair/workflow-start.txt

      - name: Check out QA controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Check out exact Host source
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/PuPu
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact Core source
        uses: actions/checkout@v4
        with:
          repository: haoxiang-xu/unchain
          ref: 33e9552f35e537a03b9cd73cb154d642481162a8
          path: core
          persist-credentials: false
      - name: Stage byte-identical Core tests and fixtures without Core source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C core status --porcelain=v1 --untracked-files=all)"
          test ! -e runtime-source
          mkdir -p runtime-source
          cp -a core/tests runtime-source/tests
          for file in pyproject.toml pytest.ini setup.cfg tox.ini conftest.py; do
            if [[ -f "core/$file" ]]; then cp -a "core/$file" "runtime-source/$file"; fi
          done
          python - <<'PY'
          import hashlib,json,pathlib
          source=pathlib.Path('core'); staged=pathlib.Path('runtime-source')
          def inventory(root):
              result={}
              for p in sorted(root.rglob('*')):
                  rel=p.relative_to(root).as_posix()
                  if p.is_symlink(): result[rel]={'type':'symlink','target':p.readlink().as_posix()}
                  elif p.is_file(): result[rel]={'type':'file','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size}
              return result
          expected={k:v for k,v in inventory(source).items() if k.startswith('tests/') or k in {'pyproject.toml','pytest.ini','setup.cfg','tox.ini','conftest.py'}}
          actual=inventory(staged)
          assert expected==actual, {'missing':sorted(expected.keys()-actual.keys()),'extra':sorted(actual.keys()-expected.keys())}
          assert not (staged/'src').exists(), 'Core source must not be on test-only PYTHONPATH'
          selectors=sorted(p.relative_to(staged).as_posix() for p in (staged/'tests').glob('test_skeleton_*.py'))
          assert len(selectors)>=40, {'selected_test_files':len(selectors)}
          pathlib.Path('test-results/pair/core-test-staging.json').write_text(json.dumps({
              'core_sha':'33e9552f35e537a03b9cd73cb154d642481162a8',
              'core_tree':'c7b327e243fd8152f869d1349776b066082d5fd9',
              'source_free_test_root':str(staged.resolve()),'selected_test_files':selectors,
              'staged_file_count':len(actual),'staged_inventory_sha256':hashlib.sha256(json.dumps(actual,sort_keys=True,separators=(',',':')).encode()).hexdigest()},indent=2)+'\n')
          PY
      - name: Set up pinned Node and Python for verification and packaging
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Download only the canonical required-CI wheel and frozen legacy sidecar
        uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - name: Download the frozen old binary control
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.legacy_artifact_name }}
          path: legacy
          run-id: ${{ inputs.legacy_run_id }}
          github-token: ${{ github.token }}
      - name: Bind repositories and verify the one wheel against the artifact evidence
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$QA_HOST_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$QA_HOST_TREE"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          test "$(git -C core rev-parse HEAD)" = "$QA_CORE_SHA"
          test "$(git -C core rev-parse 'HEAD^{tree}')" = "$QA_CORE_TREE"
          test -z "$(git -C core status --porcelain=v1 --untracked-files=all)"
          gh run view "$QA_WHEEL_RUN_ID" --repo haoxiang-xu/PuPu --json databaseId,status,conclusion,headSha \
            > test-results/pair/wheel-run.json
          python - <<'PY'
          import json,os,pathlib
          def admission(run, flag):
              assert flag in ('true','false'), 'invalid provisional boolean'
              assert isinstance(run,dict) and {'databaseId','status','conclusion','headSha'} <= run.keys(), 'missing CI metadata'
              assert type(run['databaseId']) is int and run['databaseId']==42138839492, 'wrong CI run'
              assert type(run['headSha']) is str and run['headSha']=='fa162b3d94791fad36da85f4a00ff36ecf758853', 'wrong CI head'
              assert type(run['status']) is str and (run['conclusion'] is None or type(run['conclusion']) is str), 'invalid CI metadata type'
              if run['status']=='completed' and run['conclusion']=='success':
                  return 'REQUIRED_CI_SUCCESS'
              if flag=='true' and run['status'] in ('queued','in_progress') and run['conclusion'] in (None,''):
                  return 'PROVISIONAL_PENDING'
              raise AssertionError('required CI state is not admissible')
          assert os.environ['QA_WHEEL_RUN_ID']=='42138839492', 'wrong artifact run'
          assert os.environ['QA_WHEEL_SHA']=='21f5a0794dfeb0f4d28476b3d7d6851453540b8baa4791684bf03beac4e84461', 'wrong wheel identity'
          run=json.load(open('test-results/pair/wheel-run.json'))
          mode=admission(run,os.environ['QA_ALLOW_PROVISIONAL_PAIR'])
          pathlib.Path('test-results/pair/required-ci-admission.json').write_text(json.dumps({'admission_mode':mode,'initial_run':run,'qualification_status':'PENDING'},indent=2)+'\n')
          PY
          mapfile -t wheels < <(find artifact -maxdepth 2 -type f -name '*.whl' -print)
          test "${#wheels[@]}" = 1
          WHEEL="${wheels[0]}"
          EVIDENCE=artifact/unchain-artifact.json
          test -f "$EVIDENCE"
          test "$(python -c 'import json;print(json.load(open("artifact/unchain-artifact.json"))["runtime_manifest"]["manifest_digest"])')" = "$QA_EXPECTED_MANIFEST"
          echo "$QA_WHEEL_SHA  $WHEEL" | sha256sum -c -
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$EVIDENCE" --bytes-only true
          python - "$EVIDENCE" "$WHEEL" <<'PY'
          import hashlib,json,sys,zipfile,pathlib
          evidence=json.load(open(sys.argv[1])); wheel=pathlib.Path(sys.argv[2])
          assert evidence['build']=={'built_once':True,'wheel_count':1}, evidence['build']
          assert evidence['source']['revision']=='33e9552f35e537a03b9cd73cb154d642481162a8'
          assert evidence['source']['dirty'] is False
          assert evidence['artifact']['sha256']=='sha256:'+hashlib.sha256(wheel.read_bytes()).hexdigest()
          core=pathlib.Path('core/src/unchain')
          expected={p.relative_to(pathlib.Path('core/src')).as_posix():p.read_bytes() for p in core.rglob('*.py')}
          with zipfile.ZipFile(wheel) as z:
              actual={name:z.read(name) for name in z.namelist() if name.startswith('unchain/') and name.endswith('.py')}
          assert actual.keys()==expected.keys(), {'wheel_only':sorted(actual.keys()-expected.keys()),'source_only':sorted(expected.keys()-actual.keys())}
          assert all(actual[name]==data for name,data in expected.items()), 'wheel_core_source_bytes_mismatch'
          print(evidence['runtime_manifest']['manifest_digest'])
          PY
          WHEEL="$(realpath "$WHEEL")"
          cp "$WHEEL" reusable/unchain-0.2.0-py3-none-any.whl
          cp "$EVIDENCE" reusable/unchain-artifact.json
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "QA_MANIFEST=$(python -c 'import json;print(json.load(open("artifact/unchain-artifact.json"))["runtime_manifest"]["manifest_digest"])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL_SHA=$QA_WHEEL_SHA" >> "$GITHUB_ENV"
          mapfile -t oldbins < <(find legacy -type f -name unchain-server -print)
          test "${#oldbins[@]}" = 1
          LEGACY_PATH="$(realpath "${oldbins[0]}")"
          echo "QA_LEGACY_BINARY=$LEGACY_PATH" >> "$GITHUB_ENV"
          export QA_LEGACY_BINARY="$LEGACY_PATH"
          test "$(sha256sum "$LEGACY_PATH" | cut -d' ' -f1)" = "$QA_LEGACY_SHA"
          cp "$EVIDENCE" test-results/pair/unchain-artifact.json
          export QA_WHEEL="$WHEEL" QA_WHEEL_RUN_ID="$QA_WHEEL_RUN_ID"
          python - <<'PY'
          import hashlib,json,os,pathlib
          evidence=pathlib.Path('artifact/unchain-artifact.json').read_bytes()
          wheel=pathlib.Path(os.environ['QA_WHEEL']).read_bytes()
          old=pathlib.Path(os.environ['QA_LEGACY_BINARY']).read_bytes()
          record={'host_sha':os.environ['QA_HOST_SHA'],'host_tree':os.environ['QA_HOST_TREE'],
            'core_sha':os.environ['QA_CORE_SHA'],'core_tree':os.environ['QA_CORE_TREE'],
            'wheel_sha256':hashlib.sha256(wheel).hexdigest(),'manifest':json.loads(evidence)['runtime_manifest']['manifest_digest'],
            'required_ci_run_id':os.environ['QA_WHEEL_RUN_ID'],'required_ci_run':json.loads(pathlib.Path('test-results/pair/wheel-run.json').read_text()),
            'legacy_binary_sha256':hashlib.sha256(old).hexdigest()}
          pathlib.Path('test-results/pair/pair-identity.json').write_text(json.dumps(record,indent=2)+'\n')
          PY

      - name: Bind the frozen source version without mutating package metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          package=pathlib.Path('candidate/package.json'); raw=package.read_bytes()
          version=json.loads(raw)['version']
          if not isinstance(version,str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?',version):
              raise RuntimeError('candidate_package_version_invalid')
          record={'host_sha':os.environ['QA_HOST_SHA'],'host_tree':os.environ['QA_HOST_TREE'],
            'package_json_sha256':hashlib.sha256(raw).hexdigest(),'version_from_candidate_package_json':version,
            'package_version_mutated':False}
          pathlib.Path('test-results/pair/build-version-input.json').write_text(json.dumps(record,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('PUPU_BUILD_VERSION='+version+'\n')
          PY

      - name: Install Python requirements and verified wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$QA_WHEEL" pytest==9.2.0
          python -m pip check
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$QA_WHEEL" --evidence artifact/unchain-artifact.json --bytes-only true
          python - <<'PY' >> "$GITHUB_ENV"
          import site,sys
          print('QA_PYTHON='+sys.executable)
          print('QA_SITE='+site.getsitepackages()[0])
          PY
          python -m pip freeze --all > test-results/pair/dependencies-freeze.txt

      - name: Install declared Linux runtime-control tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tcpdump gnome-keyring dbus-x11 xvfb

      - name: Run installed Host and Core contract cells
        shell: bash
        env:
          QA_CANDIDATE: ${{ inputs.candidate_sha }}
          QA_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          QA_PYTHON: ${{ env.QA_PYTHON }}
          QA_SITE: ${{ env.QA_SITE }}
          QA_WHEEL: ${{ env.QA_WHEEL }}
          QA_WHEEL_SHA: ${{ env.QA_WHEEL_SHA }}
          QA_MANIFEST: ${{ env.QA_MANIFEST }}
        run: |
          set -euo pipefail
          bash control/tools/qa356/run_offline.sh core
          bash control/tools/qa356/run_offline.sh source

      - name: Require installed Host PASS and the one exact Core deferred bundled case
        shell: bash
        run: |
          set -euo pipefail
          python control/tools/qa356/qualify_deferred_core.py installed

      - name: Scan available installed-cell evidence and record missing proof without accepting failures
        id: unit_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re
          allowed=[pathlib.Path(p) for mode in ('core','source') for p in (
            f'test-results/{mode}/acceptance.xml',f'test-results/{mode}/test-files.txt',f'test-results/{mode}/imported-runtime.json')]
          allowed += [pathlib.Path('test-results/pair/build-version-input.json'),pathlib.Path('test-results/pair/core-test-staging.json'),pathlib.Path('test-results/pair/installed-cells-summary.json'),pathlib.Path('test-results/pair/dependencies-freeze.txt'),pathlib.Path('test-results/pair/pair-identity.json'),pathlib.Path('test-results/pair/wheel-run.json'),pathlib.Path('test-results/pair/unchain-artifact.json')]
          pattern=re.compile(rb'(?i)(?:x-unchain-auth|authorization|bearer)\s*[:=]\s*[A-Za-z0-9._~+/-]{16,}')
          rows=[]; missing=[]
          for f in allowed:
              if not f.is_file():
                  missing.append(f.as_posix())
                  continue
              b=f.read_bytes()
              if pattern.search(b): raise RuntimeError('credential_like_bytes_in_unit_evidence:'+f.as_posix())
              rows.append({'path':f.as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
