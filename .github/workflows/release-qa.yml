name: Release QA diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resource-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_SOURCE: 0006e12a660de8634f9627bbc1d0082e088b8235
      QA_TREE: 0912d8aac2af7ab7d5a6c536777bc4f34a4e74ad
      QA_WHEEL_SHA: 61e570bb1ef13564079adeb036ccd7fa9d5dd64bb56d0fb017408336beb04cdc
      QA_MANIFEST: sha256:88d5f8d733e7f3dc94fb1cd20060fcc5f2611c0f94420e327bcb12664368bf2e
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0006e12a660de8634f9627bbc1d0082e088b8235
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          path: artifact
          run-id: 42160538615
          github-token: ${{ github.token }}
      - name: Prepare exact failed-CI artifact for DIAGNOSTIC_ONLY observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$QA_SOURCE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$QA_TREE"
          mapfile -t wheels < <(find artifact -type f -name '*.whl')
          test "${#wheels[@]}" = 1
          WHEEL="$(realpath "${wheels[0]}")"
          test "$(sha256sum "$WHEEL" | cut -d' ' -f1)" = "$QA_WHEEL_SHA"
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence artifact/unchain-artifact.json --bytes-only true
          python -m venv "$RUNNER_TEMP/profile-venv"
          "$RUNNER_TEMP/profile-venv/bin/python" -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          "$RUNNER_TEMP/profile-venv/bin/python" -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL" pytest==9.2.0
          "$RUNNER_TEMP/profile-venv/bin/python" -m pip check
          for tool in unshare setpriv ip systemd-run; do command -v "$tool"; done
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "QA_SITE=$($RUNNER_TEMP/profile-venv/bin/python -c 'import sysconfig;print(sysconfig.get_path("purelib"))')" >> "$GITHUB_ENV"
      # 240s execution, then at most 5s TERM cleanup before whole-cgroup KILL.
      - name: Profile one unchanged case under genuine network and process boundaries
        shell: bash
        run: |
          set -euo pipefail
          export QA_UID="$(id -u)" QA_GID="$(id -g)"
          export QA_CONTROL="$GITHUB_WORKSPACE/control/tools/qa356" QA_OUT="$RUNNER_TEMP/profile-output"
          export QA_PYTHON="$RUNNER_TEMP/profile-venv/bin/python" QA_SERVER="$GITHUB_WORKSPACE/candidate/unchain_runtime/server"
          export QA_HOME="$RUNNER_TEMP/profile-home" QA_TMP="$RUNNER_TEMP/profile-tmp"
          mkdir -p "$QA_OUT" "$QA_HOME" "$QA_TMP"
          cat > "$RUNNER_TEMP/profile-isolation.sh" <<'SH'
          set -euo pipefail
          ip link set lo up
          proof() {
            ip -j route show > "$QA_OUT/routes-$1.json"
            ip -j address show > "$QA_OUT/addresses-$1.json"
            python3 - "$QA_OUT" "$1" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);stage=sys.argv[2]
          assert json.loads((p/('routes-'+stage+'.json')).read_text())==[]
          assert [v['ifname'] for v in json.loads((p/('addresses-'+stage+'.json')).read_text())]==['lo']
          (p/('namespace-'+stage+'.json')).write_text(json.dumps({'network_namespace':__import__('os').readlink('/proc/self/ns/net'),'qualification':'DIAGNOSTIC_ONLY'})+'\n')
          PY
          }
          proof before
          trap 'proof after' EXIT
          cd "$QA_SERVER"
          setpriv --reuid="$QA_UID" --regid="$QA_GID" --clear-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env -i PATH="$(dirname "$QA_PYTHON"):/usr/bin:/bin" HOME="$QA_HOME" TMPDIR="$QA_TMP" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$QA_CONTROL:$QA_SERVER:$QA_SITE" \
            QA_OUT="$QA_OUT" QA_WHEEL="$QA_WHEEL" QA_WHEEL_SHA="$QA_WHEEL_SHA" QA_MANIFEST="$QA_MANIFEST" QA_SITE="$QA_SITE" \
            QA_EXPECT_UID="$QA_UID" QA_EXPECT_GID="$QA_GID" \
            "$QA_PYTHON" "$QA_CONTROL/resource_profile_driver.py" > "$QA_OUT/pytest.stdout.log" 2>&1
          SH
          sudo --preserve-env=QA_UID,QA_GID,QA_CONTROL,QA_OUT,QA_PYTHON,QA_SERVER,QA_HOME,QA_TMP,QA_SITE,QA_WHEEL,QA_WHEEL_SHA,QA_MANIFEST \
            systemd-run --wait --pipe --collect --service-type=exec -p MemoryMax=4G -p RuntimeMaxSec=240s -p TimeoutStopSec=5s -p KillMode=control-group \
            --setenv=QA_UID --setenv=QA_GID --setenv=QA_CONTROL --setenv=QA_OUT --setenv=QA_PYTHON --setenv=QA_SERVER --setenv=QA_HOME --setenv=QA_TMP --setenv=QA_SITE --setenv=QA_WHEEL --setenv=QA_WHEEL_SHA --setenv=QA_MANIFEST \
            unshare --net /bin/bash "$RUNNER_TEMP/profile-isolation.sh"
      - name: Scan exact diagnostic evidence before upload
        if: always()
        id: scan
        env:
          SCAN_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'profile-output'
          allowed={'before.json','profile.prof','acceptance.xml','imported-runtime.json','profile-result.json','pytest.stdout.log','routes-before.json','routes-after.json','addresses-before.json','addresses-after.json','namespace-before.json','namespace-after.json'}
          rows=[]
          for p in sorted(root.iterdir()):
              if p.name=='pytest-tmp' and p.is_dir() and not p.is_symlink(): continue
              assert p.name in allowed and p.is_file() and not p.is_symlink(), 'unexpected_evidence_file'
              b=p.read_bytes();token=os.environ.get('SCAN_TOKEN','').encode()
              assert not(token and token in b), 'credential_bytes'
              assert not re.search(rb'(?i)(?:x-unchain-auth|authorization|bearer)\s*[:=]\s*[A-Za-z0-9._~+/-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}',b), 'credential_pattern'
              rows.append({'name':p.name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'evidence-scan.json').write_text(json.dumps({'qualification':'DIAGNOSTIC_ONLY','files':rows},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('pass=true\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outputs.pass == 'true'
        with:
          name: 356-one-case-diagnostic-only
          path: |
            ${{ runner.temp }}/profile-output/*.json
            ${{ runner.temp }}/profile-output/*.xml
            ${{ runner.temp }}/profile-output/*.log
            ${{ runner.temp }}/profile-output/*.prof
          if-no-files-found: error
      - name: Safe scan-blocked status
        if: always() && steps.scan.outputs.pass != 'true'
        run: echo 'DIAGNOSTIC_ONLY evidence unavailable or scan blocked; no qualification claim.'
