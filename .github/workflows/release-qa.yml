      - name: Require final whole-CI success for the exact pair
        id: required_ci_final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,time
          def admission(run, flag):
              assert flag in ('true','false'), 'invalid provisional boolean'
              assert isinstance(run,dict) and {'databaseId','status','conclusion','headSha'} <= run.keys(), 'missing CI metadata'
              assert type(run['databaseId']) is int and run['databaseId']==42138839492, 'wrong CI run'
              assert type(run['headSha']) is str and run['headSha']=='fa162b3d94791fad36da85f4a00ff36ecf758853', 'wrong CI head'
              assert type(run['status']) is str and (run['conclusion'] is None or type(run['conclusion']) is str), 'invalid CI metadata type'
              if run['status']=='completed' and run['conclusion']=='success':
                  return 'REQUIRED_CI_SUCCESS'
              if flag=='true' and run['status'] in ('queued','in_progress') and run['conclusion'] in (None,''):
                  return 'PROVISIONAL_PENDING'
              raise AssertionError('required CI state is not admissible')
          initial=json.loads(pathlib.Path('test-results/pair/required-ci-admission.json').read_text())
          while True:
              response=subprocess.run(['gh','run','view','42138839492','--repo','haoxiang-xu/PuPu','--json','databaseId,status,conclusion,headSha'],check=True,capture_output=True,text=True,timeout=30)
              run=json.loads(response.stdout)
              state=admission(run,'true')
              if state=='REQUIRED_CI_SUCCESS':
                  pathlib.Path('test-results/pair/required-ci-final.json').write_text(json.dumps({'admission_mode':initial['admission_mode'],'final_run':run,'required_ci_status':'SUCCESS'},indent=2)+'\n')
                  break
              time.sleep(15)
          PY

      - name: Stop pcap, redact requests and gate every upload on actual auth scan
        id: auth_scan
        if: always()
        shell: bash
        run: |
          set +x
          mkdir -p test-results/status
          P=test-results/app/loopback.pcap
          RESULT=test-results/status/auth-scan-result.json
          trap 'rm -f "$P"' EXIT
          if [[ ! -s "$P" ]]; then
            printf '{"status":"NOT_RUN","reason":"capture_missing","secret_values":0,"scanned_files":0}\n' > "$RESULT"
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha256sum "$P" > test-results/app/loopback.pcap.sha256
