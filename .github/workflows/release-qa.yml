name: "#356 B4 packaged App on the fixed pair (QA only, non-delivery)"

# QA-only branch: replaces release-qa.yml so the single B4 App cell can be
# dispatched. Not for merge. The current Linux sidecar (712039ef) and the
# canonical wheel (949a8947, manifest ba894369) are the ones retained by run
# 41562427104 and are never rebuilt. Only the candidate App is packaged, then
# the prepared app_control.cjs (sidebar locator only, checkpoint 6) /
# app_lifecycle.cjs / verify_app.py run
# in a loopback-only namespace with the Chromium setuid sandbox kept on.
# Host/Core/B3 cells do not run here.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  b4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_CANDIDATE: 762c44c9450166ae94c5d0322b7a016df8caa649
      QA_WHEEL_SHA: 949a89475894b13ac324b90671c714ccd3125509cf6b313df739c66dc8292de6
      QA_BINARY_SHA: 712039ef7763b06cb5d519a13176200d5af62d83fa285cf3f057e90a103fab57
      QA_MANIFEST: sha256:ba8943695d80993066a3ad1a25f62cb0086fa9f6ca2f66d676f559841f4e8e5d
      CORE: 29e83c4b0df38089fd8c2e1b0e45dd92f2a6a1dd
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_CANDIDATE }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Read the retained current sidecar and wheel (run 41562427104)
        uses: actions/download-artifact@v4
        with:
          name: 356-runtime-pair-evidence
          path: retained
          run-id: 41562427104
          github-token: ${{ github.token }}
      - name: Bind identities without rebuilding the sidecar or wheel
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$QA_CANDIDATE"
          mkdir -p test-results artifact candidate/unchain_runtime/dist/linux
          git -C candidate rev-parse HEAD HEAD^{tree} > test-results/candidate-identity.txt
          git -C control rev-parse HEAD HEAD^{tree} > test-results/control-identity.txt
          sha256sum control/tools/qa356/* > test-results/control-tools.sha256
          echo "$QA_WHEEL_SHA  retained/artifact/unchain-0.2.0-py3-none-any.whl" | sha256sum -c -
          echo "$QA_BINARY_SHA  retained/candidate/unchain_runtime/dist/linux/unchain-server" | sha256sum -c -
          test -z "$(ls -A candidate/unchain_runtime/dist/linux)"
          cp retained/artifact/unchain-0.2.0-py3-none-any.whl retained/artifact/unchain-artifact.json artifact/
          cp retained/candidate/unchain_runtime/dist/linux/unchain-server candidate/unchain_runtime/dist/linux/unchain-server
          chmod 0755 candidate/unchain_runtime/dist/linux/unchain-server
          sha256sum artifact/unchain-0.2.0-py3-none-any.whl candidate/unchain_runtime/dist/linux/unchain-server > test-results/retained-reused.sha256
      - name: Install and verify the retained canonical wheel (harness reader only)
        run: |
          set -euo pipefail
          WHEEL="$PWD/artifact/unchain-0.2.0-py3-none-any.whl"
          python -m pip install --disable-pip-version-check -r candidate/unchain_runtime/server/requirements.txt
          python -m pip install --disable-pip-version-check --constraint candidate/unchain_runtime/server/requirements.txt "$WHEEL" pytest==9.2.0
          python -m pip check
          python -m pip freeze --all > test-results/freeze.txt
          node candidate/scripts/release-qa/verify-unchain-artifact.mjs --artifact "$WHEEL" --evidence "$PWD/artifact/unchain-artifact.json" --installed true --python python
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifact/unchain-artifact.json').read_text())
          assert evidence['source']['revision'] == os.environ['CORE']
          assert evidence['source']['dirty'] is False
          assert evidence['build'] == {'built_once': True, 'wheel_count': 1}
          assert evidence['runtime_manifest']['manifest_digest'] == os.environ['QA_MANIFEST']
          assert evidence['artifact']['sha256'] == 'sha256:' + os.environ['QA_WHEEL_SHA']
          PY
          echo "QA_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
          echo "QA_SITE=$(python -c 'import site;print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
          echo "QA_WHEEL=$WHEEL" >> "$GITHUB_ENV"
          { python -c 'import sys;print(sys.version)'; node --version; grep -m1 'model name' /proc/cpuinfo; nproc; uname -a; } > test-results/environment.txt
      - name: Install the candidate's locked App dependencies and runtime resources
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          sha256sum package-lock.json > ../test-results/package-lock.sha256
          npm ls --all --json > ../test-results/npm-dependencies.json || true
          npm run mcp-runtime:prepare -- --target linux-x64
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools
      - name: Package the actual candidate with the retained sidecar, without publishing
        working-directory: candidate
        run: |
          set -euo pipefail
          export PUPU_BUILD_VERSION="$(node -p 'require("./package.json").version')"
          export PUPU_BUILD_FEATURE_SNAPSHOT_PATH="$RUNNER_TEMP/356-build-feature-flags.json"
          printf '%s\n' '{"enable_user_access_to_agents":true,"enable_user_access_to_characters":false,"enable_custom_model_providers":true,"enable_computer_use":false}' > "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH"
          cp "$PUPU_BUILD_FEATURE_SNAPSHOT_PATH" ../test-results/build-feature-flags.input.json
          npm run build:web
          cp build/build_feature_flags.json ../test-results/build-feature-flags.packaged.json
          npm run notices
          echo "$QA_BINARY_SHA  unchain_runtime/dist/linux/unchain-server" | sha256sum -c -
          node node_modules/electron-builder/cli.js --linux dir --publish never
          PACKED="$PWD/dist/linux-unpacked/resources/unchain_runtime/dist/linux/unchain-server"
          echo "$QA_BINARY_SHA  $PACKED" | sha256sum -c -
          echo "$QA_BINARY_SHA  unchain_runtime/dist/linux/unchain-server" | sha256sum -c -
          SANDBOX="$PWD/dist/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U %a %n' "$SANDBOX" > ../test-results/chromium-sandbox.txt
          EXE="$(node -e 'const p=require("./package.json");console.log(require("path").resolve("dist/linux-unpacked",p.build?.linux?.executableName||p.name.toLowerCase()))')"
          test -x "$EXE"
          echo "QA_APP=$EXE" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_ROOT=$PWD" >> "$GITHUB_ENV"
          git status --porcelain --untracked-files=no > ../test-results/tracked-after-app-build.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/linux-unpacked')
          rows={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('../test-results/app-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Packaged App edit, execute, cold restart and second message offline
        run: bash control/tools/qa356/run_offline.sh app
      - name: Upload B4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 356-b4-app-evidence
          if-no-files-found: error
          path: |
            test-results/**
            control/tools/qa356/*
            candidate/build/static/js/*.map
