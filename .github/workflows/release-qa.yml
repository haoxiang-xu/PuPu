          QA_SITE: ${{ env.QA_SITE }}
        run: |
          python control/tools/qa356/run_windows_native_smoke.r1.py --guard test-results/windows-wfp/qa356-wfp-guard.exe --results test-results/windows-wfp
          if ($LASTEXITCODE -ne 0) { throw 'guarded native package smoke failed' }
      - name: Record native auth scan and upload gate
        id: auth_scan
        if: always()
        shell: pwsh
        run: |
          $status='FAIL'
          try {
            @'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('test-results')
          paths=[]
          for p in root.rglob('*'):
              if p.is_file() and not {'home','journal-verification-copy'}.intersection(p.parts): paths.append(p)
          token=b'sentinel-native-profile-smoke'
          rows=[]; matches=[]
          for p in paths:
              data=p.read_bytes()
              rows.append({'path':p.as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              if token in data: matches.append(p.as_posix())
          if not rows: raise RuntimeError('no intended upload files')
          if matches: raise RuntimeError('native auth sentinel found in upload bytes: '+','.join(matches))
          pathlib.Path('test-results/windows-wfp/auth-scan-result.json').write_text(json.dumps({'status':'PASS','secret_values':1,'scanned_files':len(rows),'matches':0,'files':rows},indent=2)+'\n')
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'native auth byte scan failed' }
            $status='PASS'
          } catch {
            New-Item -ItemType Directory -Force test-results/windows-wfp | Out-Null
            @{status='FAIL';reason='scan_failed_or_unknown';secret_values=1;scanned_files=0;matches=0} | ConvertTo-Json | Set-Content test-results/windows-wfp/auth-scan-result.json
            $_ | Out-String | Set-Content test-results/windows-wfp/auth-scan-error.txt
          }
          if ($status -eq 'PASS') { 'pass=true' >> $env:GITHUB_OUTPUT }
          else { 'pass=false' >> $env:GITHUB_OUTPUT; throw 'native auth scan failed; full evidence upload blocked' }
      - name: Upload full Windows qualification only after auth scan passes
        if: always() && steps.auth_scan.outputs.pass == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-windows-native-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: |
            test-results/**
            !**/home/**
            !**/journal-verification-copy/**
      - name: Upload narrow safe Windows status on any scan failure
        if: always() && steps.auth_scan.outputs.pass != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 356-windows-native-safe-status-${{ inputs.candidate_sha }}
          if-no-files-found: warn
          path: |
