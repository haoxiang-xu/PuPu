name: Ticket 351 Python diagnostic (non-delivery)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
cache-mode: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          name: unchain-release-artifact
          run-id: 41152436111
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/exact-unchain
      - name: Install the observed versions and reuse the existing wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 \
            --constraint unchain_runtime/server/requirements.txt \
            -r scripts/release-qa/351-observed-dependencies.txt \
            "${{ runner.temp }}/exact-unchain/unchain-0.2.0-py3-none-any.whl"
          python -m pip check
      - name: Offline no-dump and dump controls, serially as the runner user
        shell: bash
        env:
          QA_DIAGNOSTIC_OUT: ${{ runner.temp }}/qa-351-diagnostic
          QA_DIAGNOSTIC_WHEEL: ${{ runner.temp }}/exact-unchain/unchain-0.2.0-py3-none-any.whl
        run: |
          ulimit -c 0
          sudo -E unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" -I -B scripts/release-qa/diagnose-351-python.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket-351-python-diagnostic
          path: ${{ runner.temp }}/qa-351-diagnostic
          if-no-files-found: warn
