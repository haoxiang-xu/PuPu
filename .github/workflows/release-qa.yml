          "QA_NIC_IPV4=$($nic.IPAddress)" >> $env:GITHUB_ENV
      - name: Qualify actual interpreter receiver matrices and guard lifecycle
        shell: pwsh
        run: |
          python control/tools/qa356/windows_wfp_probe.py --guard test-results/windows-wfp/qa356-wfp-guard.exe --packaged-python "$env:QA_PACKAGED_PYTHON" --packaged-python-sha256 "$env:QA_PACKAGED_PYTHON_SHA" --sidecar "$env:QA_SIDECAR" --sidecar-sha256 "$env:QA_SIDECAR_SHA" --nic-ipv4 "$env:QA_NIC_IPV4" --results test-results/windows-wfp
          if ($LASTEXITCODE -ne 0) { throw 'native WFP qualification failed' }
      - name: Run packaged profile and Code worker inside the same three-image WFP policy
        shell: pwsh
