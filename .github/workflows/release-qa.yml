          timeout 300s sudo --preserve-env=PATH,QA_UID,QA_GID,QA_HOME,QA_TMP,QA_SERVER,QA_CONTROL,QA_SITE,QA_OUT,QA_APP,QA_WHEEL,QA_WHEEL_SHA,QA_MANIFEST,QA_BINARY_SHA,QA_PYTHON,QA_LAUNCHER,QA_PRIVATE_LOG             unshare --net /bin/bash "$RUNNER_TEMP/356-verifier-inside.sh"
      - name: Require immutable raw inputs and sealed inventory then final successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,stat,urllib.request
          R=pathlib.Path('/home/runner/work/PuPu/PuPu');out=R/'replay-safe'
          def digest(p):
           with p.open('rb') as s:return hashlib.file_digest(s,'sha256').hexdigest()
          def tree(root):return {p.relative_to(root).as_posix():digest(p) for p in root.rglob('*') if p.is_file()}
          before=json.loads((out/'input-receipt.json').read_text());files=R/'retained-replay/runtime';app=R/'candidate/dist/linux-unpacked'
          assert tree(files)==before['retained_files']
          for row,label in zip(before['artifacts'],('runtime','wheel')):assert digest(R/'retained-replay'/(label+'.zip'))==row['zip_sha256']
          work=R/'test-results/app'
          old=before['working_app_before'];now=tree(work)
          assert {k:v for k,v in old.items() if k.startswith('raw-state/')}=={k:v for k,v in now.items() if k.startswith('raw-state/')}
          # All original working inputs except the verifier's known derived output names remain exact.
          derived={'canonical-journal.json','raw-verification.json','raw-lifecycle-verification.json','lifecycle-approved-journal.json','lifecycle-cancelled-journal.json','lifecycle-child-journal.json'}
          for name,value in old.items():
           if name not in derived:assert now[name]==value
          inventory=json.loads((files/'reusable/linux-app-file-inventory.json').read_text());seen={}
          modes=json.loads((out/'tar-modes.json').read_text())
          for p in app.rglob('*'):
           name=p.relative_to(app).as_posix();s=p.lstat()
           if stat.S_ISLNK(s.st_mode):
            target=os.readlink(p);raw=target.encode();seen[name]={'type':'symlink','target':target,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()};assert p.resolve().is_relative_to(app) and p.resolve().is_file()
           elif stat.S_ISREG(s.st_mode):seen[name]={'type':'file','size':s.st_size,'sha256':digest(p)}
           else:assert stat.S_ISDIR(s.st_mode);seen[name]={'type':'directory'}
           if name in modes:assert stat.S_IMODE(s.st_mode)==modes[name]
          assert seen==inventory
          req=urllib.request.Request('https://api.github.com/repos/haoxiang-xu/PuPu/actions/runs/42319490116',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:d=json.load(response)
