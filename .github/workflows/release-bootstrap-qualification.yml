name: Bootstrap Fresh-Installed Release Baseline

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful v0.1.10 release-candidate Release QA run ID"
        required: true
        type: string
      release_tag:
        description: "Frozen bootstrap baseline tag (must be v0.1.10)"
        required: true
        type: string
      confirmation:
        description: "Type BOOTSTRAP_V0_1_10 to acknowledge restart-update is not qualified"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-bootstrap-qualification-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  environment-preflight:
    name: Verify protected qualification Environment
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node for release environment verifier
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout release environment verifier
        uses: actions/checkout@v4

      - name: Require protected release-qualification Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release-qualification" \
            | node scripts/release-qa/verify-github-environment.mjs --environment release-qualification

  candidate-preflight:
    name: Verify bootstrap policy, candidate, and legacy gap
    needs: environment-preflight
    runs-on: ubuntu-latest
    environment: release-qualification
    outputs:
      tag_commit: ${{ steps.tag.outputs.tag_commit }}
    steps:
      - name: Checkout the requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Require exact bootstrap tag, confirmation, and commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ] || [ "$RELEASE_TAG" != "v0.1.10" ]; then
            echo "::error title=Bootstrap tag required::Run the one-time bootstrap from exact v0.1.10"
            exit 1
          fi
          if [ "$CONFIRMATION" != "BOOTSTRAP_V0_1_10" ]; then
            echo "::error title=Bootstrap confirmation required::Enter BOOTSTRAP_V0_1_10"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error title=Wrong bootstrap revision::workflow SHA must equal the immutable v0.1.10 tag commit"
            exit 1
          fi
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify candidate Actions run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            | node scripts/release-qa/verify-actions-run-provenance.mjs \
              --run-id "$CANDIDATE_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$TAG_COMMIT" \
              --workflow-path .github/workflows/release-qa.yml

      - name: Download and verify exact retained candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest candidate/release-assets.v1.json \
            --asset-dir candidate/assets \
            --qa-report candidate/release-qa-report.json \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID"

      - name: Verify the immutable v0.1.9 legacy release gap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEGACY_TAG="$(node -p 'require("./contracts/release/release-bootstrap-policy.v1.json").legacy_release.tag')"
          git fetch --no-tags origin "refs/tags/$LEGACY_TAG:refs/tags/$LEGACY_TAG"
          LEGACY_TAG_COMMIT="$(git rev-list -n 1 "$LEGACY_TAG")"
          if [ -z "$LEGACY_TAG_COMMIT" ]; then
            echo "::error title=Legacy tag missing::Could not resolve the frozen legacy source"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$LEGACY_TAG" \
            | node scripts/release-qa/validate-legacy-release-gap.mjs \
              --policy contracts/release/release-bootstrap-policy.v1.json \
              --legacy-tag-commit "$LEGACY_TAG_COMMIT" \
              --out legacy-release-projection.v1.json

      - name: Upload sanitized legacy projection
        uses: actions/upload-artifact@v4
        with:
          name: release-bootstrap-legacy-projection
          if-no-files-found: error
          retention-days: 30
          path: legacy-release-projection.v1.json

  installed-package-matrix:
    name: Bootstrap fresh install ${{ matrix.target_id }}
    needs: candidate-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            os: macos-latest
          - target_id: macos-x64
            os: macos-15-intel
          - target_id: windows-x64
            os: windows-latest
          - target_id: linux-x64
            os: ubuntu-latest
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_shared-release-update-qualification.yml
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      release_tag: ${{ inputs.release_tag }}
      tag_commit: ${{ needs.candidate-preflight.outputs.tag_commit }}
      target_id: ${{ matrix.target_id }}
      runner_selector: ${{ matrix.os }}

  bootstrap-receipt:
    name: Seal one-time bootstrap qualification receipt
    needs:
      - candidate-preflight
      - installed-package-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact bootstrap tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install receipt dependencies
        run: npm ci

      - name: Download exact candidate, fresh reports, and legacy projection
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate

      - name: Download all fresh-installed reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: installed-qualification-*
          path: installed-reports
          merge-multiple: false

      - name: Download frozen legacy projection
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: release-bootstrap-legacy-projection
          path: legacy-projection

      - name: Build strict bootstrap receipt
        id: receipt
        if: always()
        continue-on-error: true
        env:
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node scripts/release-qa/build-release-bootstrap-qualification.mjs \
            --candidate-dir candidate \
            --fresh-reports-dir installed-reports \
            --policy contracts/release/release-bootstrap-policy.v1.json \
            --legacy-projection legacy-projection/legacy-release-projection.v1.json \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --confirmation "$CONFIRMATION" \
            --out release-qualification.v1.json

      - name: Upload bootstrap qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pupu-release-qualification
          if-no-files-found: warn
          retention-days: 30
          path: release-qualification.v1.json

      - name: Enforce complete bootstrap qualification
        if: always()
        env:
          PREFLIGHT_RESULT: ${{ needs.candidate-preflight.result }}
          MATRIX_RESULT: ${{ needs.installed-package-matrix.result }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          if [ "$PREFLIGHT_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ] || [ "$RECEIPT_OUTCOME" != "success" ]; then
            echo "::error title=Bootstrap qualification incomplete::candidate provenance and every fresh-installed target must pass"
            exit 1
          fi
