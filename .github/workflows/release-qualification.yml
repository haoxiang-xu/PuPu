name: Qualify Installed Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful release-candidate Release QA run ID"
        required: true
        type: string
      release_tag:
        description: "Existing vX.Y.Z tag represented by that candidate"
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-qualification-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  candidate-preflight:
    name: Verify sealed candidate provenance
    runs-on: ubuntu-latest
    outputs:
      tag_commit: ${{ steps.tag.outputs.tag_commit }}
    steps:
      - name: Checkout the requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Require dispatch from that immutable tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "::error title=Tag dispatch required::Run installed qualification from the exact release tag"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Resolve immutable tag commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error title=Release tag missing::Could not resolve $RELEASE_TAG"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$TAG_COMMIT" ]; then
            echo "::error title=Wrong dispatch revision::workflow SHA must equal the release tag commit"
            exit 1
          fi
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify candidate Actions run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            | node scripts/release-qa/verify-actions-run-provenance.mjs \
              --run-id "$CANDIDATE_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$TAG_COMMIT" \
              --workflow-path .github/workflows/release-qa.yml

      - name: Download and verify exact retained candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest candidate/release-assets.v1.json \
            --asset-dir candidate/assets \
            --qa-report candidate/release-qa-report.json \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID"

  installed-package-matrix:
    name: Qualify installed ${{ matrix.target_id }} candidate
    needs: candidate-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            os: macos-latest
          - target_id: macos-x64
            os: macos-15-intel
          - target_id: windows-x64
            os: windows-latest
          - target_id: linux-x64
            os: ubuntu-latest
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install qualification dependencies
        run: npm ci

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Download and verify exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ needs.candidate-preflight.outputs.tag_commit }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest candidate/release-assets.v1.json \
            --asset-dir candidate/assets \
            --qa-report candidate/release-qa-report.json \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT" \
            --candidate-run-id "$CANDIDATE_RUN_ID"

      - name: Run installed-package qualification
        id: installed
        continue-on-error: true
        env:
          TARGET_ID: ${{ matrix.target_id }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node scripts/release-qa/installed-package-qualification.mjs \
              --candidate-dir candidate \
              --target "$TARGET_ID" \
              --out installed-package-qualification.json
          else
            node scripts/release-qa/installed-package-qualification.mjs \
              --candidate-dir candidate \
              --target "$TARGET_ID" \
              --out installed-package-qualification.json
          fi

      - name: Upload installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-qualification-${{ matrix.target_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            installed-package-qualification.json

      - name: Enforce installed-package result
        if: always()
        env:
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        run: |
          if [ "$INSTALLED_OUTCOME" != "success" ]; then
            echo "::error title=Installed candidate qualification failed::${{ matrix.target_id }} did not pass exact installed-package checks"
            exit 1
          fi

  qualification-receipt:
    name: Seal installed-package qualification receipt
    needs:
      - candidate-preflight
      - installed-package-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install receipt dependencies
        run: npm ci

      - name: Download exact candidate and installed reports
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pupu-release-candidate --dir candidate
          mkdir -p installed-reports

      - name: Download all installed-package reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: installed-qualification-*
          path: installed-reports
          merge-multiple: false

      - name: Build strict qualification receipt
        id: receipt
        if: always()
        continue-on-error: true
        env:
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/release-qa/build-release-qualification.mjs \
            --candidate-dir candidate \
            --reports-dir installed-reports \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --out release-qualification.v1.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pupu-release-qualification
          if-no-files-found: warn
          retention-days: 30
          path: |
            release-qualification.v1.json

      - name: Enforce complete qualification
        if: always()
        env:
          PREFLIGHT_RESULT: ${{ needs.candidate-preflight.result }}
          MATRIX_RESULT: ${{ needs.installed-package-matrix.result }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          if [ "$PREFLIGHT_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ] || [ "$RECEIPT_OUTCOME" != "success" ]; then
            echo "::error title=Release qualification incomplete::candidate provenance, every installed package, and the strict receipt must pass"
            exit 1
          fi
