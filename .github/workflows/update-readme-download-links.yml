name: Render README Download Links from Verified Release Manifest

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Published vX.Y.Z tag whose verified assets should be rendered"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published vX.Y.Z tag whose verified assets should be rendered"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install manifest verifier dependencies
        run: npm ci

      - name: Reject prerelease tags before public Release access
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          STABLE_VERSION="${RELEASE_TAG#v}"
          node scripts/release-qa/release-candidate-ref.mjs \
            --tag "$RELEASE_TAG" \
            --package-version "$STABLE_VERSION" \
            --policy promotion >/dev/null

      - name: Download the published release evidence and exact public assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --clobber

      - name: Verify public release bytes before rendering links
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error title=Release tag missing::Could not resolve $RELEASE_TAG"
            exit 1
          fi
          node scripts/release-qa/verify-release-candidate.mjs \
            --manifest release-assets/release-assets.v1.json \
            --asset-dir release-assets \
            --qa-report release-assets/release-qa-report.json \
            --qualification release-assets/release-qualification.v1.json \
            --bootstrap-policy contracts/release/release-bootstrap-policy.v1.json \
            --require-qualification true \
            --require-restart-qualification true \
            --allow-extra release-assets.v1.json \
            --allow-extra release-qa-report.json \
            --allow-extra release-qualification.v1.json \
            --allow-extra windows-signing-evidence.v1.json \
            --tag "$RELEASE_TAG" \
            --commit "$TAG_COMMIT"

      - name: Render README download links from the verified manifest
        run: node scripts/update-readme-links.cjs --manifest release-assets/release-assets.v1.json

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: auto/update-readme-downloads-${{ inputs.release_tag }}
          base: main
          commit-message: "docs: render verified download links for ${{ inputs.release_tag }}"
          title: "docs: render verified download links for ${{ inputs.release_tag }}"
          body: |
            Deterministic README update generated from the published release manifest.

            The workflow re-downloaded and verified every public release asset before rendering these links.
          labels: documentation
