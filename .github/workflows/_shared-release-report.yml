name: Shared Release Report

on:
  workflow_call:
    inputs:
      qa_mode:
        description: "Closed QA mode: lite, release, or release-candidate."
        required: true
        type: string
      source_ref:
        description: Exact caller Git ref.
        required: true
        type: string
      source_sha:
        description: Exact caller commit SHA.
        required: true
        type: string
      release_tag:
        description: Exact caller ref name.
        required: true
        type: string
      deterministic_result:
        description: Closed result from the deterministic caller job.
        required: true
        type: string
      playwright_result:
        description: Closed result from the Playwright caller job.
        required: true
        type: string
      package_result:
        description: Closed result from the package caller job.
        required: true
        type: string
      run_unchain_analysis:
        description: Whether the main-branch diagnostic analyst was explicitly selected.
        required: true
        type: boolean
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  report:
    name: Final Release QA Report
    runs-on: ubuntu-latest
    env:
      QA_MODE: ${{ inputs.qa_mode }}
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DETERMINISTIC_JOB_RESULT: ${{ inputs.deterministic_result }}
      PLAYWRIGHT_JOB_RESULT: ${{ inputs.playwright_result }}
      PACKAGE_JOB_RESULT: ${{ inputs.package_result }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate closed shared final-report inputs
        shell: bash
        run: |
          if [ "$SOURCE_REF" != "$GITHUB_REF" ] || [ "$SOURCE_SHA" != "$GITHUB_SHA" ] || [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Source identity mismatch::shared final-report inputs must match the caller ref, SHA, and ref name"
            exit 1
          fi
          case "$QA_MODE" in
            lite|release|release-candidate) ;;
            *) echo "::error title=Unsupported shared final-report mode::$QA_MODE"; exit 1 ;;
          esac
          for result in "$DETERMINISTIC_JOB_RESULT" "$PLAYWRIGHT_JOB_RESULT" "$PACKAGE_JOB_RESULT"; do
            case "$result" in
              success|failure|cancelled|skipped) ;;
              *) echo "::error title=Unsupported upstream result::$result"; exit 1 ;;
            esac
          done
          if [ "${{ inputs.run_unchain_analysis }}" = "true" ] && { [ "$QA_MODE" != "release" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; }; then
            echo "::error title=Invalid analyst selection::analysis is only available for a manual release diagnostic on main"
            exit 1
          fi

      - name: Checkout PuPu
        uses: actions/checkout@v4
        with:
          path: pupu

      - name: Set up Node for final candidate assembly
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pupu/package-lock.json

      - name: Install final candidate assembly dependencies
        working-directory: pupu
        run: npm ci

      - name: Resolve final QA version
        working-directory: pupu
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "::error title=Missing package version::package.json did not provide a version"
            exit 1
          fi
          BUILD_VERSION="$PACKAGE_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_IDENTITY="$(node scripts/release-qa/release-candidate-ref.mjs \
              --tag "$GITHUB_REF_NAME" \
              --package-version "$PACKAGE_VERSION" \
              --policy candidate)"
            BUILD_VERSION="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).effectiveVersion)' "$RELEASE_IDENTITY")"
          elif [ "$QA_MODE" = "release-candidate" ]; then
            echo "::error title=Release candidate tag required::formal candidates must run from an immutable tag"
            exit 1
          fi
          echo "QA_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "QA_BASE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PUPU_BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download job reports
        uses: actions/download-artifact@v4
        with:
          pattern: release-qa-job-report-*
          path: qa-job-reports
          merge-multiple: false

      - name: Merge deterministic report
        working-directory: pupu
        run: |
          node scripts/release-qa/merge-reports.mjs \
            --input-dir ../qa-job-reports \
            --mode "$QA_MODE" \
            --expected-report-manifest contracts/memory-v2/release-qa-report-topology.v1.json \
            --out-json release-qa-report.json \
            --out-md release-qa-report.md

      - name: Install optional Unchain analyst dependencies
        if: inputs.run_unchain_analysis
        continue-on-error: true
        working-directory: pupu
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai anthropic

      - name: Run optional Unchain analyst
        if: inputs.run_unchain_analysis
        continue-on-error: true
        working-directory: pupu
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUPU_QA_PROVIDER: ${{ vars.PUPU_QA_PROVIDER || 'openai' }}
          PUPU_QA_MODEL: ${{ vars.PUPU_QA_MODEL }}
        run: |
          python scripts/release-qa/unchain-qa-analyst.py \
            --report release-qa-report.json \
            --out release-qa-analysis.json

      - name: Write final report
        if: always()
        working-directory: pupu
        shell: bash
        run: |
          ANALYSIS_ARGS=()
          if [[ -f release-qa-analysis.json ]]; then
            ANALYSIS_ARGS=(--analysis-json release-qa-analysis.json)
          fi
          node scripts/release-qa/merge-reports.mjs \
            --input-dir ../qa-job-reports \
            --mode "$QA_MODE" \
            --expected-report-manifest contracts/memory-v2/release-qa-report-topology.v1.json \
            --out-json release-qa-report.json \
            --out-md release-qa-report.md \
            --fail-on-deterministic-failure true \
            "${ANALYSIS_ARGS[@]}"
          cat release-qa-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final required report topology
        if: always()
        working-directory: pupu
        run: |
          if [ "$DETERMINISTIC_JOB_RESULT" != "success" ]; then
            echo "::error title=Deterministic job failed::deterministic-checks result was $DETERMINISTIC_JOB_RESULT"
            exit 1
          fi
          if [ "$PLAYWRIGHT_JOB_RESULT" != "success" ]; then
            echo "::error title=Playwright job failed::playwright-electron result was $PLAYWRIGHT_JOB_RESULT"
            exit 1
          fi
          if [ "$QA_MODE" != "lite" ] && [ "$PACKAGE_JOB_RESULT" != "success" ]; then
            echo "::error title=Package matrix failed::package-matrix result was $PACKAGE_JOB_RESULT"
            exit 1
          fi
          node -e "const r=require('./release-qa-report.json'); if (r.deterministic_result.status !== 'passed') { console.error('Final Release QA incomplete or failed'); process.exit(1); }"

      - name: Download exact package bytes for the release candidate
        if: env.QA_MODE == 'release-candidate'
        uses: actions/download-artifact@v4
        with:
          pattern: pupu-package-*
          path: package-artifacts
          merge-multiple: false

      - name: Assemble sealed release candidate artifact
        if: env.QA_MODE == 'release-candidate'
        working-directory: pupu
        env:
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_TAG: ${{ github.ref_name }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/release-qa/assemble-release-candidate.mjs \
            --package-dir ../package-artifacts \
            --qa-report release-qa-report.json \
            --out-dir release-candidate \
            --tag "$CANDIDATE_TAG" \
            --version "$QA_VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --run-id "$CANDIDATE_RUN_ID"

      - name: Upload sealed release candidate artifact
        if: env.QA_MODE == 'release-candidate'
        uses: actions/upload-artifact@v4
        with:
          name: pupu-release-candidate
          path: pupu/release-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Upload final QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-report
          path: |
            pupu/release-qa-report.json
            pupu/release-qa-report.md
            pupu/release-qa-analysis.json
          if-no-files-found: ignore
